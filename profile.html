<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#f0edf5">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniSpace — Статистика</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #f0edf5;
      min-height: 100vh; display: flex; flex-direction: column; color: #2a1a4a; margin: 0;
    }
    .app { display: flex; flex-direction: column; flex: 1; width: 100%; }
    
    .header { 
      display: flex; align-items: center; gap: 0.5rem;
      padding: 1rem; background: rgba(240,237,245,0.9); 
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(123,75,255,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .header-title { font-weight: 600; font-size: 1rem; color: #2a1a4a; }
    .header-count { font-size: 0.8rem; color: #6b5b8c; margin-left: auto; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(123,75,255,0.2); background: transparent;
      color: #6b5b8c; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s;
    }
    .icon-btn:hover { background: rgba(123,75,255,0.1); border-color: #7b4bff; color: #7b4bff; }

    .main { flex: 1; padding: 1.5rem; width: 100%; max-width: 1000px; margin: 0 auto; }

    .charts-section { margin-bottom: 1.5rem; }
    .charts-row { display: flex; gap: 1.5rem; }
    .chart-block { flex: 1; text-align: center; }
    .chart-title { font-size: 0.75rem; font-weight: 600; color: #6b5b8c; text-transform: uppercase; margin-bottom: 0.5rem; }
    .pie-w { display: flex; justify-content: center; }
    .pie-leg { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; justify-content: center; }
    .leg-item { display: flex; align-items: center; gap: 0.25rem; font-size: 0.65rem; color: #6b5b8c; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .card {
      background: rgba(245,242,252,0.95); border-radius: 0.8rem;
      padding: 1rem 1.2rem; border: 1px solid rgba(123,75,255,0.12);
    }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0;
    }
    .stat-label { font-size: 0.8rem; color: #6b5b8c; }
    .stat-value { font-size: 0.85rem; font-weight: 600; color: #2a1a4a; }
    .stat-value.clickable { cursor: pointer; }
    .divider { border: none; border-top: 1px solid rgba(123,75,255,0.1); margin: 0.4rem 0; }

    @media (max-width: 700px) {
      .charts-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="icon-btn" onclick="location.href='index.html'" title="Назад"><i class="fas fa-arrow-left"></i></button>
      <span class="header-title">Статистика</span>
      <span class="header-count" id="headerAnimeCount">0 аниме</span>
    </header>
    <main class="main">
      <div class="charts-section">
        <div class="charts-row">
          <div class="chart-block"><div class="chart-title">Списки</div><div id="listChart"></div></div>
          <div class="chart-block"><div class="chart-title">Жанры</div><div id="genreChart"></div></div>
          <div class="chart-block"><div class="chart-title">Теги</div><div id="tagChart"></div></div>
        </div>
      </div>
      <div class="card">
        <div class="stat-row"><span class="stat-label">Просмотрено аниме</span><span class="stat-value" id="totalWatched">0</span></div>
        <div class="stat-row"><span class="stat-label">Просмотрено серий</span><span class="stat-value" id="totalEpisodes">0</span></div>
        <div class="stat-row"><span class="stat-label clickable" id="hoursLabel">Потрачено часов</span><span class="stat-value clickable" id="totalHours">0</span></div>
        <div class="stat-row"><span class="stat-label">Написано рецензий</span><span class="stat-value" id="totalComments">0</span></div>
        <hr class="divider">
        <div class="stat-row"><span class="stat-label">Ср. оценка Shikimori</span><span class="stat-value" id="avgShikimori">—</span></div>
        <div class="stat-row"><span class="stat-label">Ср. оценка (моя)</span><span class="stat-value" id="avgScore">—</span></div>
        <div class="stat-row"><span class="stat-label">10 баллов</span><span class="stat-value" id="topRated">0</span></div>
        <div class="stat-row"><span class="stat-label">7-9 баллов</span><span class="stat-value" id="rated7to9">0</span></div>
        <div class="stat-row"><span class="stat-label">5-6 баллов</span><span class="stat-value" id="rated5to6">0</span></div>
        <div class="stat-row"><span class="stat-label"><4 баллов</span><span class="stat-value" id="ratedLess4">0</span></div>
        <hr class="divider">
        <div class="stat-row"><span class="stat-label">Самое пересматриваемое</span><span class="stat-value" id="mostRewatched">—</span></div>
        <div class="stat-row"><span class="stat-label">Любимая студия</span><span class="stat-value" id="favStudio">—</span></div>
      </div>
    </main>
  </div>

  <script>
    const getCollection = () => JSON.parse(localStorage.getItem('anix_collection') || '[]');
    const listNames = { watching:'Смотрю', watched:'Просмотрено', dropped:'Брошено', planned:'В планах', rewatching:'Пересмотрю' };
    const listColors = { watching:'#88D498', watched:'#809BCE', dropped:'#F28482', planned:'#957DAD', rewatching:'#F6BD60' };
    const tagNames = { isekai:'Исекай', slice_of_life:'Повседневное', psychology:'Психология', sport:'Спорт', romance:'Романтика', action:'Экшен', comedy:'Комедия', drama:'Драма', fantasy:'Фэнтези', horror:'Ужасы', mecha:'Меха', music:'Музыка', mystery:'Детектив', sci_fi:'Фантастика', thriller:'Триллер', adventure:'Приключения', historical:'Историческое', military:'Военное', school:'Школа', supernatural:'Сверхъестественное', hentai:'Хентай' };

    function renderPieChart(containerId, dataObj, colors, maxItems = 5) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const sorted = Object.entries(dataObj).filter(([k]) => dataObj[k] > 0).sort((a, b) => b[1] - a[1]);
      const display = sorted.slice(0, maxItems);
      const other = sorted.slice(maxItems).reduce((s, [k, v]) => s + v, 0);
      if (other > 0) display.push(['Другое', other]);
      const total = display.reduce((s, [k, v]) => s + v, 0);
      if (total === 0) { container.innerHTML = '<p style="color:#6b5b8c;font-size:0.7rem;">Нет данных</p>'; return; }
      const size = 160, cx = size/2, cy = size/2, r = 65;
      let angle = -Math.PI/2, paths = '';
      display.forEach(([key], i) => {
        const slice = (display[i][1]/total)*Math.PI*2;
        const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle);
        const x2 = cx+r*Math.cos(angle+slice), y2 = cy+r*Math.sin(angle+slice);
        paths += `<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${slice>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${colors[i%colors.length]}" stroke="#f0edf5" stroke-width="1.5"/>`;
        angle += slice;
      });
      container.innerHTML = `<div class="pie-w"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg></div><div class="pie-leg">${display.map(([key], i) => `<div class="leg-item"><div class="leg-dot" style="background:${colors[i%colors.length]};"></div>${key}: ${display[i][1]}</div>`).join('')}</div>`;
    }

    function loadStats() {
      const col = getCollection();
      const watched = col.filter(a => a.list === 'watched');
      
      document.getElementById('headerAnimeCount').textContent = col.length + ' аниме';
      document.getElementById('totalWatched').textContent = watched.length;
      const eps = watched.reduce((s, a) => s + (parseInt(a.episodes) || 0), 0);
      document.getElementById('totalEpisodes').textContent = eps;
      document.getElementById('totalHours').textContent = Math.round(eps * 24 / 60) || 0;
      document.getElementById('totalComments').textContent = col.filter(a => a.comment && a.comment.trim()).length;
      
      const shikimoriScores = watched.filter(a => a.avgRating).map(a => parseFloat(a.avgRating));
      document.getElementById('avgShikimori').textContent = shikimoriScores.length ? (shikimoriScores.reduce((a, b) => a + b, 0) / shikimoriScores.length).toFixed(1) : '—';
      
      const scores = col.filter(a => a.userRating).map(a => parseFloat(a.userRating));
      document.getElementById('avgScore').textContent = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : '—';
      
      const userRatings = col.filter(a => a.userRating).map(a => parseFloat(a.userRating));
      document.getElementById('topRated').textContent = userRatings.filter(r => r === 10).length;
      document.getElementById('rated7to9').textContent = userRatings.filter(r => r >= 7 && r <= 9).length;
      document.getElementById('rated5to6').textContent = userRatings.filter(r => r >= 5 && r <= 6).length;
      document.getElementById('ratedLess4').textContent = userRatings.filter(r => r < 5).length;      
      const rewatched = col.filter(a => a.rewatchCount > 0).sort((a, b) => (b.rewatchCount || 0) - (a.rewatchCount || 0));
      document.getElementById('mostRewatched').textContent = rewatched.length ? rewatched[0].title + ` (${rewatched[0].rewatchCount} раз)` : '—';
      
      const studioCounts = {};
      watched.forEach(a => { if (a.studio) a.studio.split(',').forEach(s => { const ss = s.trim(); if (ss) studioCounts[ss] = (studioCounts[ss] || 0) + 1; }); });
      const favStudio = Object.entries(studioCounts).sort((a, b) => b[1] - a[1])[0];
      document.getElementById('favStudio').textContent = favStudio ? favStudio[0] : '—';

      const listCounts = {};
      col.forEach(a => { const l = a.list || 'watching'; listCounts[listNames[l]] = (listCounts[listNames[l]] || 0) + 1; });
      renderPieChart('listChart', listCounts, Object.values(listColors));
      const genreCounts = {};
      col.forEach(a => { if (a.genre) a.genre.split(',').forEach(g => { const gg = g.trim(); if (gg) genreCounts[gg] = (genreCounts[gg] || 0) + 1; }); });
      renderPieChart('genreChart', genreCounts, ['#88D498','#809BCE','#F28482','#957DAD','#F6BD60','#b47aff','#51cf66','#f0b300','#ff6b6b','#06c']);
      const tagCounts = {};
      col.forEach(a => { if (a.tag && tagNames[a.tag]) { const t = tagNames[a.tag]; tagCounts[t] = (tagCounts[t] || 0) + 1; } });
      renderPieChart('tagChart', tagCounts, ['#F6BD60','#957DAD','#88D498','#809BCE','#F28482','#b47aff','#51cf66','#f0b300','#ff6b6b']);
    }

    document.getElementById('totalHours').onclick = () => {
      const el = document.getElementById('totalHours');
      const label = document.getElementById('hoursLabel');
      const eps = parseInt(document.getElementById('totalEpisodes').textContent) || 0;
      const h = Math.round(eps * 24 / 60) || 0;
      if (label.textContent.includes('Потрачено часов')) {
        el.textContent = (h / 24).toFixed(1);
        label.textContent = 'Потрачено дней';
      } else {
        el.textContent = h;
        label.textContent = 'Потрачено часов';
      }
    };

    loadStats();
  </script>
</body>
</html>
