<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#f0edf5">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniSpace — Поиск аниме</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #f0edf5;
      min-height: 100vh; display: flex; flex-direction: column; color: #2a1a4a; margin: 0;
    }
    .app { display: flex; flex-direction: column; flex: 1; width: 100%; }
    
    .header { 
      display: flex; align-items: center; gap: 0.5rem;
      padding: 1rem; background: rgba(240,237,245,0.9); 
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(123,75,255,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .header-title { font-weight: 600; font-size: 1rem; color: #2a1a4a; margin-left: 0.5rem; margin-right: auto; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(123,75,255,0.2); background: transparent;
      color: #6b5b8c; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s;
    }
    .icon-btn:hover { background: rgba(123,75,255,0.1); border-color: #7b4bff; color: #7b4bff; }

    .main { flex: 1; display: flex; flex-direction: column; width: 100%; }
    
    .search-section {
      position: sticky; top: 60px; z-index: 99;
      background: #f0edf5; padding: 0.8rem 1.5rem;
      border-bottom: 1px solid rgba(123,75,255,0.1);
    }
    .search-wrap {
      display: flex; align-items: center; gap: 0.3rem;
      background: rgba(245,242,252,0.95);
      border-radius: 1.5rem; border: 1px solid rgba(123,75,255,0.15);
      padding: 0.2rem 0.2rem 0.2rem 0.3rem;
      width: 100%;
    }
    .search-wrap:focus-within { border-color: #7b4bff; }
    .mini-select {
      background: rgba(123,75,255,0.06); border: 1px solid rgba(123,75,255,0.15);
      border-radius: 1.5rem; padding: 0.35rem 0.7rem; color: #2a1a4a;
      font-size: 0.7rem; outline: none; font-family: inherit; cursor: pointer;
      flex-shrink: 0;
    }
    .search-inp { 
      flex: 1; background: transparent; border: none; 
      padding: 0.5rem 0.5rem; color: #2a1a4a; font-size: 0.85rem; outline: none; 
    }
    .search-inp::placeholder { color: #6b5b8c; font-size: 0.8rem; }
    .search-btn { 
      background: #7b4bff; border: none; color: white; 
      width: 34px; height: 34px; border-radius: 50%; 
      cursor: pointer; font-size: 0.85rem; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .search-btn:hover { background: #925fff; }

    .content-area { flex: 1; padding: 1rem 1.5rem; overflow-y: auto; }
    
    .search-results { display: none; }
    .search-results.show { display: block; margin-bottom: 1rem; }
    .res-item { 
      padding: 0.6rem 0.8rem; cursor: pointer; border-radius: 0.6rem; 
      color: #2a1a4a; font-size: 0.85rem; transition: 0.1s; 
      display: flex; align-items: center; gap: 0.6rem; 
      background: rgba(245,242,252,0.95); border: 1px solid rgba(123,75,255,0.1); 
      margin-bottom: 0.3rem; 
    }
    .res-item:hover { background: rgba(123,75,255,0.08); border-color: rgba(123,75,255,0.3); }
    .res-item img { width: 40px; height: 56px; border-radius: 0.4rem; object-fit: cover; }
    .res-item-info { flex: 1; }
    .res-item-title { font-weight: 600; }
    .res-item-meta { font-size: 0.7rem; color: #6b5b8c; }
    .add-btn {
      background: #51cf66; border: none; color: white; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; font-size: 0.8rem; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .add-btn:hover { background: #40c057; }
    .add-btn.saved { background: #7b4bff; }

    .section-wrap { }
    .section-title { 
      font-size: 0.75rem; font-weight: 600; color: #6b5b8c; 
      text-transform: uppercase; margin-bottom: 0.5rem; 
      display: flex; align-items: center; gap: 0.3rem; 
    }
    .popular-row { 
      display: flex; gap: 0.5rem; overflow-x: auto; 
      padding-top: 0.3rem;
      padding-bottom: 0.8rem;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .popular-row::-webkit-scrollbar { display: none; }
    .popular-card {
      flex-shrink: 0; width: 140px; border-radius: 0.6rem; overflow: hidden;
      cursor: pointer; transition: 0.2s; background: rgba(235,230,245,0.9);
      border: 1px solid rgba(123,75,255,0.12); position: relative;
    }
    .popular-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); border-color: #7b4bff; }
    .popular-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .popular-card-title { 
      font-size: 0.7rem; font-weight: 600; color: #2a1a4a; 
      padding: 0.4rem; text-align: center; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; 
    }
    .loading-card { 
      flex-shrink: 0; width: 140px; aspect-ratio: 2/3; 
      border-radius: 0.6rem; background: rgba(123,75,255,0.05); 
      animation: pulse 1.5s infinite; 
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }

    .loading-overlay { 
      display: none; position: fixed; top: 0; left: 0; 
      width: 100%; height: 100%; background: rgba(0,0,0,0.3); 
      z-index: 150; align-items: center; justify-content: center; 
    }
    .spinner { color: #7b4bff; font-size: 2rem; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .empty-state { text-align: center; color: #6b5b8c; padding: 2rem; font-size: 0.85rem; }

    @media (max-width: 600px) {
      .header { padding: 0.75rem 1rem; }
      .search-section { padding: 0.6rem 1rem; top: 52px; }
      .content-area { padding: 0.8rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="icon-btn" onclick="history.back()" title="Назад"><i class="fas fa-arrow-left"></i></button>
      <span class="header-title">Поиск аниме</span>
    </header>
    <main class="main">
      <div class="search-section">
        <div class="search-wrap">
          <select class="mini-select" id="listSelect">
            <option value="planned" selected>В планах</option>
            <option value="watching">Смотрю</option>
            <option value="watched">Просмотрено</option>
            <option value="dropped">Брошено</option>
            <option value="rewatching">Пересмотрю</option>
          </select>
          <select class="mini-select" id="tagSelect">
            <option value="">Без тега</option>
            <option value="isekai">Исекай</option>
            <option value="slice_of_life">Повседневное</option>
            <option value="psychology">Психология</option>
            <option value="sport">Спорт</option>
            <option value="romance">Романтика</option>
            <option value="action">Экшен</option>
            <option value="comedy">Комедия</option>
            <option value="drama">Драма</option>
            <option value="fantasy">Фэнтези</option>
            <option value="horror">Ужасы</option>
            <option value="mecha">Меха</option>
            <option value="music">Музыка</option>
            <option value="mystery">Детектив</option>
            <option value="sci_fi">Фантастика</option>
            <option value="thriller">Триллер</option>
            <option value="adventure">Приключения</option>
            <option value="historical">Историческое</option>
            <option value="military">Военное</option>
            <option value="school">Школа</option>
            <option value="supernatural">Сверхъестественное</option>
            <option value="hentai">Хентай</option>
          </select>
          <input type="text" class="search-inp" id="searchInput" placeholder="Название аниме...">
          <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
      </div>
      <div class="content-area" id="contentArea">
        <div class="section-wrap">
          <div class="section-title"><i class="fas fa-fire"></i> Популярные сейчас</div>
          <div class="popular-row" id="popularRow">
            <div class="loading-card"></div><div class="loading-card"></div><div class="loading-card"></div><div class="loading-card"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div class="loading-overlay" id="loadingOverlay"><i class="fas fa-circle-notch spinner"></i></div>

  <script>
    const contentArea = document.getElementById('contentArea');

    const CORS_PROXY = 'https://corsproxy.io/?';

    async function loadPopular() {
      const row = document.getElementById('popularRow');
      if (!row) return;
      
      try {
        const res = await fetch('https://api.jikan.moe/v4/top/anime?filter=airing&limit=8');
        const data = await res.json();
        
        row.innerHTML = '';
        
        for (const item of data.data) {
          const a = item;
          const poster = a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || '';
          const engTitle = a.title_english || a.title;
          
          // Получаем русское название
          const rusTitle = await getRussianTitle(engTitle);
          
          const card = document.createElement('div');
          card.className = 'popular-card';
          card.innerHTML = `
            ${poster ? `<img src="${poster}" onerror="this.style.display='none'">` : ''}
            <div class="popular-card-title">${rusTitle || engTitle}</div>`;
          card.onclick = () => addAnime(a);
          row.appendChild(card);
        }
      } catch(e) { 
        console.error(e);
        row.innerHTML = '<div style="font-size:0.7rem;color:#6b5b8c;">Не удалось загрузить</div>'; 
      }
    }

    // Функция для получения русского названия через Shikimori
    async function getRussianTitle(engTitle) {
      try {
        const shikiUrl = CORS_PROXY + encodeURIComponent(`https://shikimori.one/api/animes?search=${encodeURIComponent(engTitle)}&limit=1`);
        const shikiRes = await fetch(shikiUrl);
        if (shikiRes.ok) {
          const shikiData = await shikiRes.json();
          if (shikiData && shikiData.length > 0) {
            return shikiData[0].russian || shikiData[0].name || engTitle;
          }
        }
      } catch(e) {}
      return engTitle;
    }

    function bindSearch() {
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const searchResults = document.getElementById('searchResults') || createSearchResults();
      const loadingOverlay = document.getElementById('loadingOverlay');
      const searchIcon = searchBtn.querySelector('i');

      async function performSearch() {
        const q = searchInput.value.trim();
        
        if (!q) { 
          searchResults.classList.remove('show'); 
          return; 
        }
        
        loadingOverlay.style.display = 'flex';
        try {
          let searchQuery = q;
          let list = [];
          
          // Проверяем, русский ли текст (содержит кириллицу)
          const isRussian = /[а-яА-Я]/.test(q);
          
          if (isRussian) {
            // Шаг 1: Ищем английское название через Shikimori
            try {
              const shikiUrl = CORS_PROXY + encodeURIComponent(`https://shikimori.one/api/animes?search=${encodeURIComponent(q)}&limit=1`);
              const shikiRes = await fetch(shikiUrl);
              if (shikiRes.ok) {
                const shikiData = await shikiRes.json();
                if (shikiData && shikiData.length > 0) {
                  // Берем английское/оригинальное название
                  searchQuery = shikiData[0].name || shikiData[0].english || q;
                }
              }
            } catch(e) {
              console.log('Shikimori не ответил, ищем напрямую');
            }
          }
          
          // Шаг 2: Ищем через Jikan с английским названием
          const malSearchUrl = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(searchQuery)}&limit=10`;
          const res = await fetch(malSearchUrl);
          
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          
          const data = await res.json();
          list = data.data || [];
          
          // Внутри performSearch(), где мапим результаты
          const listWithRussianTitles = await Promise.all(list.map(async (a) => {
            const rusTitle = await getRussianTitle(a.title_english || a.title);
            return { ...a, _rusTitle: rusTitle };
          }));

          searchResults.innerHTML = listWithRussianTitles.length ? listWithRussianTitles.map(a => {
            const poster = a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || '';
            const year = a.aired?.from ? new Date(a.aired.from).getFullYear() : '—';
            const episodes = a.episodes || '?';
            const score = a.score || '—';
            
            return `<div class="res-item" data-mal-id="${a.mal_id}">
              ${poster ? `<img src="${poster}" onerror="this.style.display='none'">` : '<div style="width:40px;height:56px;background:rgba(123,75,255,0.1);border-radius:0.4rem;display:flex;align-items:center;justify-content:center;color:#6b5b8c;"><i class="fas fa-image"></i></div>'}
              <div class="res-item-info">
                <div class="res-item-title">${a._rusTitle || a.title_english || a.title || '—'}</div>
                <div class="res-item-meta">${year} · ${episodes} эп. · ⭐ ${score}</div>
              </div>
              <button class="add-btn" data-mal-id="${a.mal_id}" title="Добавить"><i class="fas fa-plus"></i></button>
            </div>`;
          }).join('') : '<div class="empty-state">Ничего не найдено</div>';
          
          searchResults.classList.add('show');
          searchIcon.className = 'fas fa-times';
          searchBtn.onclick = clearSearch;
          
          searchResults.querySelectorAll('.add-btn').forEach(btn => {
            btn.onclick = (e) => {
              e.stopPropagation();
              const anime = list.find(a => a.mal_id == btn.dataset.malId);
              if (anime) {
                addAnime(anime);
                btn.classList.add('saved');
                btn.innerHTML = '<i class="fas fa-check"></i>';
              }
            };
          });
          
          searchResults.querySelectorAll('.res-item').forEach(item => {
            item.onclick = () => {
              const anime = list.find(a => a.mal_id == item.dataset.malId);
              if (anime) addAnime(anime);
            };
          });
          
        } catch(e) { 
          console.error(e);
          searchResults.innerHTML = '<div class="empty-state">Ошибка поиска</div>'; 
          searchResults.classList.add('show'); 
        }
        loadingOverlay.style.display = 'none';
      }

      function clearSearch() {
        searchInput.value = '';
        searchResults.classList.remove('show');
        searchResults.innerHTML = '';
        searchIcon.className = 'fas fa-search';
        searchBtn.onclick = performSearch;
        searchInput.focus();
      }

      searchBtn.onclick = performSearch;
      
      searchInput.onkeypress = e => { 
        if (e.key === 'Enter') performSearch(); 
      };
      
      let searchTimeout;
      searchInput.oninput = () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 500);
      };
      
      searchInput.addEventListener('input', () => {
        if (searchInput.value.trim() === '') {
          searchResults.classList.remove('show');
          searchIcon.className = 'fas fa-search';
          searchBtn.onclick = performSearch;
        }
      });
    }

    function createSearchResults() {
      const div = document.createElement('div');
      div.className = 'search-results';
      div.id = 'searchResults';
      const sectionWrap = document.querySelector('.section-wrap');
      contentArea.insertBefore(div, sectionWrap);
      return div;
    }

    async function addAnime(anime) {
      const list = document.getElementById('listSelect').value;
      const tag = document.getElementById('tagSelect').value;
      
      const collection = JSON.parse(localStorage.getItem('anix_collection') || '[]');
      
      // Базовое название (английское из MAL)
      const engTitle = anime.title_english || anime.title;
      
      // Получаем русские данные через Shikimori
      let ruData = null;
      try {
        const shikiUrl = CORS_PROXY + encodeURIComponent(`https://shikimori.one/api/animes?search=${encodeURIComponent(engTitle)}&limit=1`);
        const shikiRes = await fetch(shikiUrl);
        if (shikiRes.ok) {
          const shikiList = await shikiRes.json();
          if (shikiList && shikiList.length > 0) {
            // Получаем полные данные
            const detailUrl = CORS_PROXY + encodeURIComponent(`https://shikimori.one/api/animes/${shikiList[0].id}`);
            const detailRes = await fetch(detailUrl);
            if (detailRes.ok) {
              ruData = await detailRes.json();
            } else {
              ruData = shikiList[0];
            }
          }
        }
      } catch(e) {
        console.log('Не удалось получить русские данные');
      }
      
      // Формируем данные
      const title = ruData?.russian || ruData?.name || engTitle;
      const originalName = ruData?.name || anime.title;
      
      // Проверка на дубликат
      const exists = collection.find(a => a.title === title);
      if (exists) {
        exists.list = list;
        exists.tag = tag || exists.tag;
        localStorage.setItem('anix_collection', JSON.stringify(collection));
        showToast('Обновлено!');
        return;
      }
      
      // Жанры на русском
      const genres = ruData?.genres 
        ? ruData.genres.map(g => g.russian || g.name).filter(Boolean).join(', ')
        : (anime.genres || []).map(g => g.name).filter(Boolean).join(', ');
      
      // Студии
      const studios = ruData?.studios 
        ? ruData.studios.map(s => s.name).join(', ')
        : (anime.studios || []).map(s => s.name).join(', ');
      
      // Дата
      const date = ruData?.aired_on 
        ? ruData.aired_on.split('-').reverse().join('.')
        : (anime.aired?.from ? new Date(anime.aired.from).toISOString().split('T')[0].split('-').reverse().join('.') : '');
      
      // Статус на русском
      const statusMap = { 
        released: 'Вышел', 
        ongoing: 'Онгоинг', 
        anons: 'Анонсирован',
        'Currently Airing': 'Онгоинг',
        'Finished Airing': 'Вышел'
      };
      const status = statusMap[ruData?.status] || statusMap[anime.status] || 'Вышел';
      
      // Описание на русском
      const description = ruData?.description_html || ruData?.description || anime.synopsis || '—';
      const cleanDescription = description
        .replace(/<[^>]*>/g, '')
        .replace(/\[.*?\]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      
      // Постер
      const poster = anime.images?.jpg?.large_image_url || 
                    anime.images?.jpg?.image_url || 
                    (ruData?.image ? 'https://shikimori.one' + ruData.image.original : '');
      
      const data = {
        id: Date.now(), 
        title, 
        originalName: originalName || '',
        genre: genres || '—',
        episodes: String(ruData?.episodes || anime.episodes || '—'), 
        avgRating: ruData?.score || anime.score || '—',
        releaseDate: date || '—', 
        status, 
        studio: studios || '—',
        description: cleanDescription || '—',
        list, tag,
        userRating: '7',
        poster,
        addedAt: new Date().toISOString(), 
        shikimoriId: ruData?.id || null,
        malId: anime.mal_id || null
      };
      
      collection.unshift(data);
      localStorage.setItem('anix_collection', JSON.stringify(collection));
      showToast('Добавлено!');
    }

    function showToast(msg) {
      let toast = document.getElementById('toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.style.cssText = 'position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#2a1a4a;color:#f0edf5;padding:0.6rem 1.2rem;border-radius:2rem;font-size:0.8rem;z-index:500;transition:opacity 0.3s;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => toast.style.opacity = '0', 2000);
    }

    bindSearch();
    loadPopular();
  </script>
</body>
</html>
