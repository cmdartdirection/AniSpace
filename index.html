<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#f0edf5">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniSpace — Библиотека</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #f0edf5;
      min-height: 100vh; display: flex; flex-direction: column; color: #2a1a4a; margin: 0;
    }

    .app { display: flex; flex-direction: column; flex: 1; width: 100%; }

    .header { 
      display: flex; align-items: center; gap: 0.5rem;
      padding: 1rem 1.5rem; background: rgba(240,237,245,0.9); 
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(123,75,255,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .header-title {
      font-weight: 600; font-size: 1rem; color: #2a1a4a;
      margin-right: auto;
    }
    .header-actions { display: flex; gap: 0.3rem; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(123,75,255,0.2); background: transparent;
      color: #6b5b8c; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; position: relative;
    }
    .icon-btn:hover { background: rgba(123,75,255,0.1); border-color: #7b4bff; color: #7b4bff; }
    .icon-btn::after {
      content: attr(data-tooltip);
      position: absolute; top: 110%; left: 50%;
      transform: translateX(-50%);
      background: #2a1a4a; color: #f0edf5;
      font-size: 0.7rem; padding: 0.3rem 0.6rem; border-radius: 0.4rem;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease; transition-delay: 0s; z-index: 300;
    }
    .icon-btn:hover::after { opacity: 1; transition-delay: 0.6s; }

    .main { flex: 1; display: flex; flex-direction: column; padding: 0.5rem 1.5rem 2rem; width: 100%; max-width: 1200px; margin: 0 auto; }

    .controls-bar {
      display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center;
      margin-bottom: 1rem;
      position: relative;
    }
    .tab { 
      background: rgba(123,75,255,0.06); border: 1px solid rgba(123,75,255,0.15); 
      color: #6b5b8c; font-size: 0.8rem; padding: 0.4rem 0.9rem; border-radius: 2rem; 
      cursor: pointer; transition: 0.2s; font-family: inherit; white-space: nowrap;
    }
    .tab.active { background: rgba(123,75,255,0.3); border-color: #7b4bff; color: #2a1a4a; font-weight: 600; }
    .tab.bm { padding: 0.4rem 0.5rem; }
    .tab.bm.active { background: linear-gradient(135deg, #f5d57a, #fce9a9); border-color: #e8c547; color: #5a4a2a; }
    .tab:hover:not(.active) { background: rgba(123,75,255,0.15); }

    .controls-spacer { flex: 1; }

    .search-inp { 
      background: rgba(245,242,252,0.95); border: 1px solid rgba(123,75,255,0.25); 
      color: #2a1a4a; font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 1.5rem; 
      outline: none; font-family: inherit; flex: 1; min-width: 120px;
    }
    .search-inp::placeholder { color: #6b5b8c; }
    .search-inp:focus { border-color: #7b4bff; }
    .hidden { display: none; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.8rem; }
    .card { 
      position: relative; aspect-ratio: 2/3; border-radius: 0.6rem; overflow: hidden; 
      cursor: pointer; transition: 0.2s; border: 1px solid rgba(123,75,255,0.15); 
      background: rgba(235,230,245,0.9);
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); border-color: rgba(123,75,255,0.4); }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-over { 
      position: absolute; bottom: 0; left: 0; width: 100%; padding: 0.5rem; 
      background: linear-gradient(transparent, rgba(0,0,0,0.85)); opacity: 0; transition: 0.2s;
    }
    .card:hover .card-over { opacity: 1; }
    .card-ttl { font-weight: 600; font-size: 0.7rem; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-yr { font-size: 0.6rem; color: #b5a3d4; }
    .card-rate { 
      position: absolute; top: 0.4rem; right: 0.4rem; background: rgba(0,0,0,0.7); 
      color: #f0b300; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 0.3rem; font-weight: 600;
    }
    .card-list { 
      position: absolute; bottom: 0.4rem; left: 0.4rem; font-size: 0.55rem; 
      padding: 0.1rem 0.35rem; border-radius: 0.3rem; font-weight: 600; color: white;
    }
    .card-emp { 
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
      color: #8b7aaa;
    }
    .empty { text-align: center; color: #6b5b8c; padding: 3rem; font-size: 0.95rem; grid-column: 1 / -1; }

    /* Дропдауны */
    .dropdown-menu {
      position: absolute; top: calc(100% + 0.5rem);
      background: #f0edf5; border: 1px solid rgba(123,75,255,0.2);
      border-radius: 1rem; padding: 0.8rem; display: none;
      flex-direction: column; gap: 0.5rem; min-width: 220px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1); z-index: 200;
    }
    .dropdown-menu.show { display: flex; }
    #filterDropdown { 
      left: 50%;
      transform: translateX(-50%);
    }
    #sortDropdown { 
      left: 50%;
      transform: translateX(-50%);
    }
    .dropdown-section { display: flex; flex-direction: column; gap: 0.2rem; }
    .dropdown-label { font-size: 0.7rem; font-weight: 600; color: #6b5b8c; text-transform: uppercase; }
    .dropdown-select {
      padding: 0.4rem 0.6rem; border-radius: 0.6rem;
      border: 1px solid rgba(123,75,255,0.25); background: white;
      color: #2a1a4a; font-size: 0.8rem; font-family: inherit; outline: none;
    }
    .dropdown-select:focus { border-color: #7b4bff; }
    .dropdown-actions { display: flex; gap: 0.3rem; }
    .dropdown-btn {
      flex: 1; padding: 0.4rem; border-radius: 1.5rem; border: none;
      background: linear-gradient(135deg, #7b4bff, #b084ff); color: white;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .dropdown-btn:hover { background: linear-gradient(135deg, #925fff, #c09aff); }
    .dropdown-btn-reset {
      background: transparent; border: 1px solid rgba(123,75,255,0.2); color: #6b5b8c;
    }
    .dropdown-btn-reset:hover { background: rgba(123,75,255,0.1); color: #2a1a4a; }

    .sort-option {
      padding: 0.5rem 0.8rem; border-radius: 0.6rem; border: none;
      background: transparent; color: #2a1a4a; font-size: 0.8rem; cursor: pointer;
      text-align: left; font-family: inherit; transition: 0.1s;
    }
    .sort-option:hover { background: rgba(123,75,255,0.1); }
    .sort-option.active { background: rgba(123,75,255,0.2); font-weight: 600; }

    @media (max-width: 600px) {
      .header { padding: 0.75rem 1rem; }
      .main { padding: 1rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.5rem; }
      .card-over { opacity: 1; padding: 0.3rem; }
      .card-ttl { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <span class="header-title">Библиотека</span>
      <div class="header-actions">
        <button class="icon-btn" data-tooltip="Добавить" id="addAnimeBtn">
          <i class="fas fa-plus-circle"></i>
        </button>
        <button class="icon-btn" data-tooltip="Статистика" id="statsBtn">
          <i class="fas fa-chart-bar"></i>
        </button>
        <button class="icon-btn" data-tooltip="Данные" id="dataBtn">
          <i class="fas fa-database"></i>
        </button>
        <button class="icon-btn" data-tooltip="Топ" id="topBtn">
          <i class="fas fa-crown"></i>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="controls-bar">
        <button class="tab bm" data-tab="bookmarked">
          <i class="fas fa-bookmark"></i>
        </button>
        <button class="tab" data-tab="watching">Смотрю</button>
        <button class="tab" data-tab="watched">Просмотрено</button>
        <button class="tab" data-tab="dropped">Брошено</button>
        <button class="tab" data-tab="planned">В планах</button>
        <button class="tab" data-tab="rewatching">Пересмотрю</button>

        <div class="controls-spacer"></div>

        <!-- Фильтры -->
        <span style="position:relative;">
          <div class="dropdown-menu" id="filterDropdown">
            <div class="dropdown-section">
              <label class="dropdown-label">Жанр</label>
              <select class="dropdown-select" id="filterGenreSelect">
                <option value="">Все жанры</option>
              </select>
            </div>
            <div class="dropdown-section">
              <label class="dropdown-label">Тег</label>
              <select class="dropdown-select" id="filterTagSelect">
                <option value="">Все теги</option>
              </select>
            </div>
          </div>
          <button class="icon-btn" data-tooltip="Фильтры" id="filterBtn">
            <i class="fas fa-sliders"></i>
          </button>
        </span>

        <!-- Сортировка -->
        <span style="position:relative;">
          <div class="dropdown-menu" id="sortDropdown">
            <button class="sort-option active" data-sort="addedAt">По дате добавления</button>
            <button class="sort-option" data-sort="title">По названию</button>
            <button class="sort-option" data-sort="releaseDate">По дате выхода</button>
            <button class="sort-option" data-sort="userRating">По личному рейтингу</button>
            <button class="sort-option" data-sort="avgRating">По рейтингу Shikimori</button>
          </div>
          <button class="icon-btn" data-tooltip="Сортировка" id="sortBtn">
            <i class="fas fa-arrow-down-wide-short"></i>
          </button>
        </span>

        <input type="text" class="search-inp" id="libSearchInput" placeholder="Поиск по названию...">
      </div>

      <!-- Скрытые селекты -->
      <select class="hidden" id="genreFilter"><option value="">Все жанры</option></select>
      <select class="hidden" id="tagFilter"><option value="">Все теги</option></select>
      <select class="hidden" id="sortSelect">
        <option value="addedAt" selected>По дате добавления</option>
        <option value="title">По названию</option>
        <option value="releaseDate">По дате выхода</option>
        <option value="userRating">По личному рейтингу</option>
        <option value="avgRating">По рейтингу Shikimori</option>
      </select>

      <div class="grid" id="animeGrid"></div>
    </main>
  </div>

<script>
    let currentTab = 'all', allAnime = [];

    const listColors = { watching:'#88D498', watched:'#809BCE', dropped:'#F28482', planned:'#957DAD', rewatching:'#F6BD60' };
    const listNames = { watching:'Смотрю', watched:'Просмотрено', dropped:'Брошено', planned:'В планах', rewatching:'Пересмотрю' };
    const tagNames = { isekai:'Исекай', slice_of_life:'Повседневное', psychology:'Психология', sport:'Спорт', romance:'Романтика', action:'Экшен', comedy:'Комедия', drama:'Драма', fantasy:'Фэнтези', horror:'Ужасы', mecha:'Меха', music:'Музыка', mystery:'Детектив', sci_fi:'Фантастика', thriller:'Триллер', adventure:'Приключения', historical:'Историческое', military:'Военное', school:'Школа', supernatural:'Сверхъестественное', hentai:'Хентай' };

    const loadCol = () => allAnime = JSON.parse(localStorage.getItem('anix_collection') || '[]');
    const sortSelect = document.getElementById('sortSelect');
    const genreFilter = document.getElementById('genreFilter');
    const tagFilter = document.getElementById('tagFilter');

    function getFiltered() {
      let f = [...allAnime];
      if (currentTab !== 'all') {
        if (currentTab === 'bookmarked') f = f.filter(a => a.bookmarked === true);
        else f = f.filter(a => (a.list || 'watching') === currentTab);
      }
      if (genreFilter.value) f = f.filter(a => a.genre && a.genre.includes(genreFilter.value));
      if (tagFilter.value) f = f.filter(a => a.tag === tagFilter.value);
      
      f.sort((a, b) => ({
        title:(a.title||'').localeCompare(b.title||''), 
        addedAt:(b.addedAt||'').localeCompare(a.addedAt||''), 
        releaseDate: (() => {
          const parse = d => { if (!d) return 0; const p = d.split('.'); return +p[2]*10000 + +p[1]*100 + +p[0]; };
          return parse(b.releaseDate) - parse(a.releaseDate);
        })(),
        userRating:parseFloat(b.userRating||0)-parseFloat(a.userRating||0), 
        avgRating:parseFloat(b.avgRating||0)-parseFloat(a.avgRating||0)
      })[sortSelect.value]||0);
      
      return f;
    }

    function popFilters() {
      const genres = new Set(); 
      allAnime.forEach(a => { if (a.genre) a.genre.split(',').forEach(g => genres.add(g.trim())); });
      genreFilter.innerHTML = '<option value="">Все жанры</option>' + [...genres].sort().map(g => `<option value="${g}">${g}</option>`).join('');
      const tags = new Set(); 
      allAnime.forEach(a => { if (a.tag) tags.add(a.tag); });
      tagFilter.innerHTML = '<option value="">Все теги</option>' + [...tags].sort().map(t => `<option value="${t}">${tagNames[t] || t}</option>`).join('');
    }

    function createCard(anime) {
      const card = document.createElement('div');
      card.className = 'card';
      const year = anime.releaseDate ? anime.releaseDate.split('.')[2] || '' : '';
      const blur = anime.tag === 'hentai' ? 'filter: blur(6px);' : '';
      const rating = anime.avgRating ? parseFloat(anime.avgRating).toFixed(1) : (anime.rating ? parseFloat(anime.rating).toFixed(1) : '—');
      card.innerHTML = `
        ${anime.poster ? `<img src="${anime.poster}" alt="" style="${blur}">` : '<div class="card-emp"><i class="fas fa-image"></i></div>'}
        <div class="card-list" style="background:${listColors[anime.list]||'#88D498'};">${listNames[anime.list]||'—'}</div>
        <div class="card-over"><div class="card-ttl">${anime.title||'—'}</div><div class="card-yr">${year||'—'}</div></div>`;
      card.onclick = () => location.href = `anime.html?id=${anime.id}`;
      return card;
    }

    function renderGrid(list) {
      const grid = document.getElementById('animeGrid');
      grid.innerHTML = '';
      if (!list.length) { 
        grid.innerHTML = '<div class="empty"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>Ничего не найдено</div>'; 
        return; 
      }
      list.forEach(a => grid.appendChild(createCard(a)));
    }

    function render() {
      loadCol(); 
      popFilters();
      renderGrid(getFiltered());
    }

    // Навигация
    document.getElementById('addAnimeBtn').onclick = () => location.href = 'animeadd.html';
    document.getElementById('statsBtn').onclick = () => location.href = 'profile.html';
    document.getElementById('dataBtn').onclick = () => location.href = 'eximport.html';
    document.getElementById('topBtn').onclick = () => alert('Топ аниме — в разработке');

    // Вкладки
    document.querySelector('.controls-bar').addEventListener('click', function(e) {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      if (tab.dataset.tab === currentTab) {
        currentTab = 'all';
      } else {
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
      }
      renderGrid(getFiltered());
    });

    // === Дропдаун фильтров ===
    const filterDropdown = document.getElementById('filterDropdown');
    const filterGenreSelect = document.getElementById('filterGenreSelect');
    const filterTagSelect = document.getElementById('filterTagSelect');

    document.getElementById('filterBtn').onclick = function(e) {
      e.stopPropagation();
      document.getElementById('sortDropdown').classList.remove('show');
      const genres = [...new Set(allAnime.flatMap(a => (a.genre||'').split(',').map(g => g.trim()).filter(Boolean)))].sort();
      const tags = [...new Set(allAnime.map(a => a.tag).filter(Boolean))].sort();
      filterGenreSelect.innerHTML = '<option value="">Все жанры</option>' + genres.map(g => `<option value="${g}" ${genreFilter.value === g ? 'selected' : ''}>${g}</option>`).join('');
      filterTagSelect.innerHTML = '<option value="">Все теги</option>' + tags.map(t => `<option value="${t}" ${tagFilter.value === t ? 'selected' : ''}>${tagNames[t] || t}</option>`).join('');
      filterDropdown.classList.toggle('show');
    };

    // Авто-применение при выборе
    filterGenreSelect.onchange = function() {
      genreFilter.value = this.value;
      tagFilter.value = '';
      filterTagSelect.value = '';
      genreFilter.dispatchEvent(new Event('change'));
    };

    filterTagSelect.onchange = function() {
      tagFilter.value = this.value;
      genreFilter.value = '';
      filterGenreSelect.value = '';
      genreFilter.dispatchEvent(new Event('change'));
    };

    // === Дропдаун сортировки ===
    const sortDropdown = document.getElementById('sortDropdown');

    document.getElementById('sortBtn').onclick = function(e) {
      e.stopPropagation();
      filterDropdown.classList.remove('show');
      document.querySelectorAll('.sort-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.sort === sortSelect.value);
      });
      sortDropdown.classList.toggle('show');
    };

    document.querySelectorAll('.sort-option').forEach(opt => {
      opt.onclick = function() {
        sortSelect.value = this.dataset.sort;
        sortSelect.dispatchEvent(new Event('change'));
        sortDropdown.classList.remove('show');
      };
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('#filterBtn') && !e.target.closest('#filterDropdown')) {
        filterDropdown.classList.remove('show');
      }
      if (!e.target.closest('#sortBtn') && !e.target.closest('#sortDropdown')) {
        sortDropdown.classList.remove('show');
      }
    });

    genreFilter.onchange = () => renderGrid(getFiltered());
    tagFilter.onchange = () => renderGrid(getFiltered());
    sortSelect.onchange = () => renderGrid(getFiltered());

    // Поиск
    document.getElementById('libSearchInput').addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const title = card.querySelector('.card-ttl')?.textContent?.toLowerCase() || '';
        card.style.display = !q || title.includes(q) ? '' : 'none';
      });
    });

    render();
</script>
</body>
</html>
