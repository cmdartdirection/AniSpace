<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#f0edf5">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniSpace — Данные</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #f0edf5;
      min-height: 100vh; display: flex; flex-direction: column; color: #2a1a4a; margin: 0;
    }
    .app { display: flex; flex-direction: column; flex: 1; width: 100%; }
    .header { 
      display: flex; align-items: center; gap: 0.5rem;
      padding: 1rem; background: rgba(240,237,245,0.9); 
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(123,75,255,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .header-title { font-weight: 600; font-size: 1rem; color: #2a1a4a; margin-left: 0.5rem; margin-right: auto; }
    .header-actions { display: flex; gap: 0.3rem; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(123,75,255,0.2); background: transparent;
      color: #6b5b8c; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; position: relative;
    }
    .icon-btn:hover { background: rgba(123,75,255,0.1); border-color: #7b4bff; color: #7b4bff; }
    .icon-btn::after {
      content: attr(data-tooltip); position: absolute; top: 110%; left: 50%;
      transform: translateX(-50%); background: #2a1a4a; color: #f0edf5;
      font-size: 0.7rem; padding: 0.3rem 0.6rem; border-radius: 0.4rem;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease; transition-delay: 0s; z-index: 300;
    }
    .icon-btn:hover::after { opacity: 1; transition-delay: 0.6s; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 1.5rem; width: 100%; }
    .info-card {
    background: rgba(245,242,252,0.95); border-radius: 0.8rem;
    padding: 1rem 1.2rem; border: 1px solid rgba(123,75,255,0.12);
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0; border-bottom: 1px solid rgba(123,75,255,0.08);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 0.8rem; color: #6b5b8c; }
    .info-value { font-size: 0.85rem; font-weight: 600; color: #2a1a4a; }
    .storage-bar {
      height: 4px; background: rgba(123,75,255,0.1); border-radius: 2px;
      margin-top: 0.5rem; overflow: hidden;
    }
    .storage-fill {
      height: 100%; background: linear-gradient(to right, #7b4bff, #b084ff);
      border-radius: 2px; transition: width 0.3s ease;
    }
    
    .action-buttons {
      display: flex; gap: 0.8rem; margin-top: 1rem;
    }
    .big-btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 0.3rem;
      padding: 0.5rem; border-radius: 0.6rem; border: none;
      font-size: 0.7rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: 0.2s;
    }
    .big-btn i { font-size: 0.8rem !important; }
    .export-btn {
      background: linear-gradient(135deg, #7b4bff, #b084ff);
      color: white;
    }
    .export-btn:hover { background: linear-gradient(135deg, #925fff, #c09aff); }
    .import-btn {
      background: rgba(123,75,255,0.08); border: 1px solid rgba(123,75,255,0.2);
      color: #6b5b8c;
    }
    .import-btn:hover { background: rgba(123,75,255,0.15); color: #2a1a4a; }

    /* Тост прогресса */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      background: #2a1a4a; color: #f0edf5; border-radius: 0.8rem;
      padding: 0.8rem 1rem; z-index: 500; display: none;
      flex-direction: column; gap: 0.4rem; min-width: 220px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .toast.show { display: flex; }
    .toast-text { font-size: 0.75rem; }
    .toast-bar {
      height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden;
    }
    .toast-fill {
      height: 100%; background: #7b4bff; border-radius: 2px; transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="icon-btn" onclick="location.href='index.html'" title="Назад">
        <i class="fas fa-arrow-left"></i>
      </button>
      <span class="header-title">Данные</span>
      <div class="header-actions">
        <button class="icon-btn" data-tooltip="Обновить битые" id="refreshDbBtn">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button class="icon-btn" data-tooltip="Обновить все обложки" id="refreshAllPostersBtn">
          <i class="fas fa-images"></i>
        </button>
      </div>
    </header>
    <main class="main">
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">Аниме в библиотеке</span>
          <span class="info-value" id="animeCount">0</span>
        </div>
        <div class="info-row">
          <span class="info-label">Последний экспорт</span>
          <span class="info-value" id="lastExport">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Последний импорт</span>
          <span class="info-value" id="lastImport">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Размер базы</span>
          <span class="info-value" id="storageSize">—</span>
        </div>
        <div class="storage-bar">
          <div class="storage-fill" id="storageFill" style="width:0%;"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="big-btn export-btn" id="exportDataBtn">
          <i class="fas fa-download"></i>
          <span>Экспорт</span>
        </button>
        <button class="big-btn import-btn" id="importDataBtn">
          <i class="fas fa-upload"></i>
          <span>Импорт</span>
        </button>
      </div>
      <input type="file" id="importFileInput" accept=".json" style="display:none;">
    </main>
  </div>

  <!-- Тост прогресса -->
  <div class="toast" id="toast">
    <div class="toast-text" id="toastText">Обновление...</div>
    <div class="toast-bar"><div class="toast-fill" id="toastFill" style="width:0%;"></div></div>
  </div>

  <script>
    const collection = JSON.parse(localStorage.getItem('anix_collection') || '[]');
    document.getElementById('animeCount').textContent = collection.length;
    
    // Размер JSON-файла при экспорте
    const exportData = {
      collection: collection.map(a => ({...a, poster: a.poster && a.poster.startsWith('http') ? a.poster : ''})),
      profile: (p => { delete p.avatar; delete p.banner; return p; })(JSON.parse(localStorage.getItem('anix_profile') || '{}')),
      showcases: JSON.parse(localStorage.getItem('anix_showcases') || '[]'),
      folders: JSON.parse(localStorage.getItem('anix_folders') || '[]'),
      exportedAt: new Date().toISOString()
    };
    const jsonBytes = new Blob([JSON.stringify(exportData)]).size;
    const jsonMB = (jsonBytes / 1024 / 1024).toFixed(2);
    document.getElementById('storageSize').textContent = `${jsonMB} МБ / 5 МБ (${((jsonBytes / (5 * 1024 * 1024)) * 100).toFixed(1)}%)`;
    document.getElementById('storageFill').style.width = Math.min((jsonBytes / (5 * 1024 * 1024)) * 100, 100).toFixed(1) + '%';
    
    const lastExport = localStorage.getItem('anix_last_export');
    const lastImport = localStorage.getItem('anix_last_import');
    document.getElementById('lastExport').textContent = lastExport ? new Date(lastExport).toLocaleString('ru-RU') : '—';
    document.getElementById('lastImport').textContent = lastImport ? new Date(lastImport).toLocaleString('ru-RU') : '—';

    // Экспорт
    document.getElementById('exportDataBtn').onclick = () => {
      localStorage.setItem('anix_last_export', new Date().toISOString());
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'}));
      a.download = 'anispace_backup.json';
      a.click();
      setTimeout(() => location.reload(), 500);
    };

    // Импорт
    const importFileInput = document.getElementById('importFileInput');
    document.getElementById('importDataBtn').onclick = () => importFileInput.click();
    importFileInput.onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.collection) localStorage.setItem('anix_collection', JSON.stringify(d.collection));
          if (d.profile) localStorage.setItem('anix_profile', JSON.stringify(d.profile));
          if (d.showcases) localStorage.setItem('anix_showcases', JSON.stringify(d.showcases));
          if (d.folders) localStorage.setItem('anix_folders', JSON.stringify(d.folders));
          localStorage.setItem('anix_last_import', new Date().toISOString());
          alert('Загружено!');
          location.reload();
        } catch(er) { alert('Ошибка: ' + er.message); }
      };
      reader.readAsText(file);
    };

    // === Обновление базы ===
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    const toastFill = document.getElementById('toastFill');

    async function getAniListPoster(title) {
      try {
        const query = `query ($search: String) { Page(page: 1, perPage: 1) { media(search: $search, type: ANIME) { coverImage { large } } } }`;
        const res = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ query, variables: { search: title } })
        });
        if (res.ok) {
          const data = await res.json();
          return data.data?.Page?.media?.[0]?.coverImage?.large || '';
        }
      } catch(e) {}
      return '';
    }

async function loadScreenshots(anilistId) {
  if (!anilistId) return [];
  try {
    const query = `
      query($id: Int) {
        Media(id: $id, type: ANIME) {
          bannerImage
          coverImage { extraLarge }
        }
      }`;
    
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query, variables: { id: anilistId } }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    
    if (res.ok) {
      const data = await res.json();
      // AniList не возвращает скриншоты, только баннер
      // Поэтому скриншоты пока оставим пустыми
      return [];
    }
  } catch(e) {
    console.warn(`Пропущен AniList ${anilistId}: ${e.message}`);
  }
  return [];
}

async function getAccuratePoster(anime) {
  let newPoster = '';
  
  // Если есть MAL ID — получаем точно
  if (anime.malId) {
    try {
      const malRes = await fetch(`https://api.jikan.moe/v4/anime/${anime.malId}`);
      if (malRes.ok) {
        const malData = await malRes.json();
        newPoster = malData.data?.images?.jpg?.large_image_url || 
                   malData.data?.images?.jpg?.image_url || '';
        if (newPoster) return newPoster;
      }
    } catch(e) {}
  }
  
  // Если нет MAL ID или не сработало — ищем по названию
  try {
    const malSearchUrl = `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(anime.title)}&limit=1`;
    const malRes = await fetch(malSearchUrl);
    if (malRes.ok) {
      const malData = await malRes.json();
      if (malData.data && malData.data.length > 0) {
        newPoster = malData.data[0].images?.jpg?.large_image_url || 
                   malData.data[0].images?.jpg?.image_url || '';
      }
    }
  } catch(e) {}
  
  return newPoster;
}

// Обновление только отсутствующих/битых постеров
document.getElementById('refreshDbBtn').onclick = async () => {
  const col = JSON.parse(localStorage.getItem('anix_collection') || '[]');
  if (!col.length) { alert('Нет аниме для обновления'); return; }
  
  toast.classList.add('show');
  let updated = 0;
  
  for (let i = 0; i < col.length; i++) {
    const a = col[i];
    
    const needsNewPoster = !a.poster || 
                           a.poster.includes('missing_original') || 
                           a.poster.includes('shikimori.one');
    
    if (needsNewPoster) {
      const newPoster = await getAccuratePoster(a);
      if (newPoster && newPoster !== a.poster) {
        a.poster = newPoster;
        col[i] = a;
        localStorage.setItem('anix_collection', JSON.stringify(col));
        updated++;
      }
    }
    
    toastText.textContent = `Обновлено ${updated} из ${col.length}`;
    toastFill.style.width = ((i + 1) / col.length * 100) + '%';
    await new Promise(r => setTimeout(r, 500));
  }
  
  toastText.textContent = updated > 0 ? `Готово! Обновлено ${updated} постеров` : 'Все постеры актуальны';
  toastFill.style.width = '100%';
  setTimeout(() => { toast.classList.remove('show'); location.reload(); }, 3000);
};

// Обновление ВСЕХ постеров
document.getElementById('refreshAllPostersBtn').onclick = async () => {
  const col = JSON.parse(localStorage.getItem('anix_collection') || '[]');
  if (!col.length) { alert('Нет аниме для обновления'); return; }
  
  if (!confirm('Обновить ВСЕ обложки? Это может занять время.')) return;
  
  toast.classList.add('show');
  let updated = 0;
  
  for (let i = 0; i < col.length; i++) {
    const a = col[i];
    const newPoster = await getAccuratePoster(a);
    
    if (newPoster && newPoster !== a.poster) {
      a.poster = newPoster;
      col[i] = a;
      localStorage.setItem('anix_collection', JSON.stringify(col));
      updated++;
    }
    
    toastText.textContent = `Обновлено ${updated} из ${col.length}`;
    toastFill.style.width = ((i + 1) / col.length * 100) + '%';
    await new Promise(r => setTimeout(r, 700));
  }
  
  toastText.textContent = updated > 0 ? `Готово! Обновлено ${updated} постеров` : 'Все постеры актуальны';
  toastFill.style.width = '100%';
  setTimeout(() => { toast.classList.remove('show'); location.reload(); }, 3000);
};
  </script>
</body>
</html>
