<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>AniX — Библиотека</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0e0e1a 0%, #1a1a2e 100%);
      min-height: 100vh; display: flex; flex-direction: column; color: #f0e6ff; margin: 0;
    }
    .app-wrapper { display: flex; flex-direction: column; flex: 1; width: 100%; min-height: 100vh; }
    .top-bar { padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: center; position: relative; }
    .logo-center {
      background: linear-gradient(135deg, #7b4bff, #b084ff); border: none; color: white; font-weight: bold;
      font-size: 1.2rem; padding: 0.5rem 1.4rem; border-radius: 2.5rem; cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(123,75,255,0.5); letter-spacing: 0.5px; border: 1px solid rgba(255,255,255,0.2);
    }
    .logo-center:hover { background: linear-gradient(135deg, #925fff, #c09aff); transform: translateY(-1px); }
    .profile-avatar-top {
      position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px;
      border-radius: 50%; border: 2px solid rgba(180,130,255,0.6); cursor: pointer; overflow: hidden;
      background: rgba(123,75,255,0.2); transition: 0.25s;
    }
    .profile-avatar-top:hover { border-color: #b47aff; box-shadow: 0 0 15px rgba(150,100,255,0.5); }
    .profile-avatar-top img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-avatar-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #c9a9ff; font-size: 1.1rem; }
    .mode-toggle {
      position: absolute; left: 1.5rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px;
      border-radius: 50%; border: 2px solid rgba(180,130,255,0.4); cursor: pointer; background: rgba(123,75,255,0.15);
      color: #c9a9ff; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: 0.25s;
    }
    .mode-toggle:hover { border-color: #b47aff; color: white; background: rgba(123,75,255,0.3); }
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 0.5rem 1.5rem 2rem; width: 100%; max-width: 1200px; margin: 0 auto; }
    .tabs-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab-btn {
      background: rgba(180,130,255,0.1); border: 1px solid rgba(180,130,255,0.2); color: #b5a3d4;
      font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; transition: 0.2s;
      font-family: inherit; white-space: nowrap;
    }
    .tab-btn.active { background: rgba(123,75,255,0.4); border-color: #b47aff; color: white; }
    .tab-btn:hover { background: rgba(123,75,255,0.3); color: white; }
    .controls-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .control-select {
      background: rgba(15,12,28,0.8); border: 1px solid rgba(180,150,220,0.3); color: #cbb8f0;
      font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 1.5rem; cursor: pointer; font-family: inherit; outline: none;
    }
    .control-select:focus { border-color: #b47aff; }
    .random-btn {
      background: linear-gradient(135deg, #ff6b9d, #ff4444); border: none; color: white; font-size: 0.8rem;
      padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 0.3rem; margin-left: auto;
    }
    .random-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,68,68,0.5); }
    .count-text { font-size: 0.8rem; color: #8b7aaa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.8rem; }
    .card {
      position: relative; aspect-ratio: 2/3; border-radius: 0.6rem; overflow: hidden; cursor: pointer;
      transition: 0.2s; border: 1px solid rgba(180,130,255,0.2); background: rgba(25,22,44,0.6);
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.5); border-color: rgba(180,130,255,0.5); }
    .card-poster { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 0.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.9)); opacity: 0; transition: 0.2s; }
    .card:hover .card-overlay { opacity: 1; }
    .card-title { font-weight: 600; font-size: 0.7rem; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-year { font-size: 0.6rem; color: #b5a3d4; }
    .card-rating { position: absolute; top: 0.4rem; right: 0.4rem; background: rgba(0,0,0,0.7); color: #f0b300; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 0.3rem; font-weight: 600; }
    
    .card:hover .card-list-badge {
      opacity: 0;
      transition: 0.2s;
    }

    .card-list-badge {
      position: absolute;
      bottom: 0.4rem;
      left: 0.4rem;
      font-size: 0.55rem;
      padding: 0.1rem 0.35rem;
      border-radius: 0.3rem;
      font-weight: 600;
      color: white;
      opacity: 1;
      transition: 0.2s;
    }

    .card-empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #5a4b7a; }
    .empty-state { text-align: center; color: #8b7aaa; padding: 3rem; font-size: 0.95rem; grid-column: 1 / -1; }

    /* Папки */
    .folder-section {
      margin-bottom: 1rem;
      background: rgba(25,22,44,0.4);
      border-radius: 0.8rem;
      border: 1px solid rgba(180,130,255,0.15);
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding: 0.6rem 0.8rem;
      background: rgba(30,25,50,0.5);
      border-bottom: 1px solid rgba(180,130,255,0.1);
    }

    .folder-header:hover .folder-title { color: white; }

    .folder-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbb8f0;
      transition: 0.2s;
    }

    .folder-count {
      font-size: 0.7rem;
      color: #8b7aaa;
    }

    .folder-avg {
      font-size: 0.7rem;
      color: #f0b300;
      margin-left: auto;
    }

    .folder-toggle {
      color: #8b7aaa;
      transition: 0.2s;
      font-size: 0.7rem;
    }

    .folder-toggle.collapsed i {
      transform: rotate(-90deg);
    }

    .folder-body {
      transition: 0.2s;
      padding: 0.6rem;
    }

    .folder-body.collapsed {
      display: none;
    }

    .folder-actions {
      display: flex;
      gap: 0.3rem;
      margin-left: 0.5rem;
    }

    .folder-action-btn {
      background: transparent;
      border: none;
      color: #6b5b8c;
      cursor: pointer;
      font-size: 0.65rem;
      padding: 0.15rem 0.3rem;
      border-radius: 0.3rem;
      transition: 0.2s;
    }

    .folder-action-btn:hover {
      color: white;
      background: rgba(180,130,255,0.2);
    }

    .folders-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .folder-section {
      width: 100%;
      margin-bottom: 0;
    }
    .add-folder-btn {
      background: rgba(180,130,255,0.1);
      border: 1px dashed rgba(180,130,255,0.3);
      color: #8b7aaa;
      padding: 0.5rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      text-align: center;
      margin-bottom: 1rem;
      width: 100%;
    }
    .folder-grid {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .folder-grid .card {
      width: 130px;
      flex-shrink: 0;
    }

    .add-folder-btn {
      margin-top: 1rem;
    }

    .add-folder-btn:hover {
      background: rgba(180,130,255,0.2);
      color: #cbb8f0;
    }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
    .modal-box { background: rgba(25,22,44,0.98); border: 1px solid rgba(180,130,255,0.5); border-radius: 1.2rem; padding: 1.5rem; max-width: 450px; width: 90%; box-shadow: 0 20px 40px black; max-height: 80vh; overflow-y: auto; }
    .modal-title { font-weight: 600; color: #cbb8f0; margin-bottom: 1rem; }
    .modal-input { width: 100%; background: rgba(10,8,20,0.7); border: 1px solid rgba(180,150,220,0.35); border-radius: 0.6rem; padding: 0.5rem 0.8rem; color: #e4d7ff; font-size: 0.85rem; margin-bottom: 0.8rem; font-family: inherit; outline: none; }
    .modal-input:focus { border-color: #b47aff; }
    .modal-btns { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .modal-btn { padding: 0.45rem 1.2rem; border-radius: 1.5rem; font-size: 0.8rem; cursor: pointer; transition: 0.2s; border: none; font-family: inherit; }
    .modal-btn.cancel { background: rgba(255,255,255,0.1); color: #b5a3d4; }
    .modal-btn.save { background: linear-gradient(135deg, #7b4bff, #b084ff); color: white; }
    .modal-btn.danger { background: rgba(255,80,80,0.3); color: #ff6b6b; }

    footer { text-align: left; padding: 1rem; color: #5a507a; font-size: 0.8rem; border-top: 1px solid rgba(120,100,180,0.3); margin-top: auto; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="top-bar">
      <div class="mode-toggle" id="modeToggle" title="Режим папок"><i class="fas fa-folder"></i></div>
      <button class="logo-center" id="goHomeBtn" title="На главную">AniX</button>
      <div class="profile-avatar-top" id="profileAvatarTop" title="Профиль">
        <img id="topAvatarImg" src="" alt="" style="display:block;">
        <div class="profile-avatar-placeholder" id="topAvatarPlaceholder"><i class="fas fa-user"></i></div>
      </div>
    </div>

    <main class="main-content">
      <div class="tabs-row" id="tabsRow">
        <button class="tab-btn active" data-tab="all">Все</button>
        <button class="tab-btn" data-tab="bookmarked">Избранное</button>
        <button class="tab-btn" data-tab="watching">Смотрю</button>
        <button class="tab-btn" data-tab="watched">Просмотрено</button>
        <button class="tab-btn" data-tab="dropped">Брошено</button>
        <button class="tab-btn" data-tab="planned">В планах</button>
        <button class="tab-btn" data-tab="rewatching">Пересмотрю</button>
      </div>

      <div class="controls-row" id="controlsRow">
        <select class="control-select" id="genreFilter"><option value="">Все жанры</option></select>
        <select class="control-select" id="tagFilter"><option value="">Все теги</option></select>
        <select class="control-select" id="sortSelect">
          <option value="title">По названию</option>
          <option value="addedAt">По дате добавления</option>
          <option value="releaseDate">По дате выхода</option>
          <option value="userRating">По личному рейтингу</option>
          <option value="avgRating">По рейтингу Shikimori</option>
        </select>
        <span class="count-text" id="countText">0 аниме</span>
        <button class="random-btn" id="randomBtn"><i class="fas fa-random"></i> Случайное</button>
      </div>

      <div class="grid" id="animeGrid"></div>
    </main>
    <footer>© AniX by Кяру</footer>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">Папка</div>
      <input type="text" class="modal-input" id="modalFolderName" placeholder="Название папки">
      <div class="modal-btns">
        <button class="modal-btn save" id="modalSaveBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const goHomeBtn = document.getElementById('goHomeBtn');
      const profileAvatarTop = document.getElementById('profileAvatarTop');
      const modeToggle = document.getElementById('modeToggle');
      const tabsRow = document.getElementById('tabsRow');
      const genreFilter = document.getElementById('genreFilter');
      const tagFilter = document.getElementById('tagFilter');
      const sortSelect = document.getElementById('sortSelect');

      const randomBtn = document.getElementById('randomBtn');
      const animeGrid = document.getElementById('animeGrid');
      const countText = document.getElementById('countText');

      topAvatarImg.src = 'profile/avatar.png';
      topAvatarImg.style.display = 'block';
      topAvatarPlaceholder.style.display = 'none';
      
      const editModal = document.getElementById('editModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalFolderName = document.getElementById('modalFolderName');
      const modalSaveBtn = document.getElementById('modalSaveBtn');

      let currentTab = 'all';
      let folderMode = false;
      let allAnime = [];
      let currentEditingFolder = null;

      let lastRandomId = null;

      document.getElementById('topAvatarImg').src = 'profile/avatar.gif';
      document.getElementById('topAvatarImg').style.display = 'block';

      const listColors = { watching:'#88D498', watched:'#809BCE', dropped:'#F28482', planned:'#957DAD', rewatching:'#F6BD60' };
      const listNames = { watching:'Смотрю', watched:'Просмотрено', dropped:'Брошено', planned:'В планах', rewatching:'Пересмотрю' };
      const tagNames = { isekai:'Исекай', slice_of_life:'Повседневное', psychology:'Психология', sport:'Спорт', romance:'Романтика', action:'Экшен', comedy:'Комедия', drama:'Драма', fantasy:'Фэнтези', horror:'Ужасы', mecha:'Меха', music:'Музыка', mystery:'Детектив', sci_fi:'Фантастика', thriller:'Триллер', adventure:'Приключения', historical:'Историческое', military:'Военное', school:'Школа', supernatural:'Сверхъестественное' };

      function loadCollection() { allAnime = JSON.parse(localStorage.getItem('anix_collection') || '[]'); }
      function saveCollection() { localStorage.setItem('anix_collection', JSON.stringify(allAnime)); }
      function getFolders() { return JSON.parse(localStorage.getItem('anix_folders') || '[]'); }
      function saveFolders(f) { localStorage.setItem('anix_folders', JSON.stringify(f)); }

      function getFilteredAnime() {
        let filtered = [...allAnime];
        if (currentTab !== 'all') {
          if (currentTab === 'bookmarked') filtered = filtered.filter(a => a.bookmarked === true);
          else filtered = filtered.filter(a => (a.list || 'watching') === currentTab);
        }
        if (genreFilter.value) filtered = filtered.filter(a => a.genre && a.genre.includes(genreFilter.value));
        if (tagFilter.value) filtered = filtered.filter(a => a.tag === tagFilter.value);
        filtered.sort((a, b) => {
          switch (sortSelect.value) {
            case 'title': return (a.title || '').localeCompare(b.title || '');
            case 'addedAt': return (b.addedAt || '').localeCompare(a.addedAt || '');
            case 'releaseDate': return (b.releaseDate || '').localeCompare(a.releaseDate || '');
            case 'userRating': return parseFloat(b.userRating || 0) - parseFloat(a.userRating || 0);
            case 'avgRating': return parseFloat(b.avgRating || 0) - parseFloat(a.avgRating || 0);
            default: return 0;
          }
        });
        return filtered;
      }

      function populateFilters() {
        const genres = new Set(); allAnime.forEach(a => { if (a.genre) a.genre.split(',').forEach(g => genres.add(g.trim())); });
        genreFilter.innerHTML = '<option value="">Все жанры</option>';
        [...genres].sort().forEach(g => { genreFilter.innerHTML += `<option value="${g}">${g}</option>`; });
        const tags = new Set(); allAnime.forEach(a => { if (a.tag) tags.add(a.tag); });
        tagFilter.innerHTML = '<option value="">Все теги</option>';
        [...tags].sort().forEach(t => { tagFilter.innerHTML += `<option value="${t}">${tagNames[t] || t}</option>`; });
      }

      function createCard(anime) {
        const card = document.createElement('div');
        card.className = 'card';
        const year = anime.releaseDate ? anime.releaseDate.split('.')[2] || '' : '';
        const listColor = listColors[anime.list] || '#88D498';

        const hasTag = anime.tag !== 'hentai';
        const blurStyle = hasTag ? '' : 'filter: blur(6px);';
        const displayRating = anime.avgRating ? parseFloat(anime.avgRating).toFixed(1) : (anime.rating ? parseFloat(anime.rating).toFixed(1) : '—');
        
        card.innerHTML = `
          ${anime.poster ? `<img src="${anime.poster}" class="card-poster" alt="" style="${blurStyle}">` : '<div class="card-empty"><i class="fas fa-image"></i></div>'}
          <div class="card-rating">⭐ ${displayRating}</div>
          <div class="card-list-badge" style="background:${listColor};">${listNames[anime.list] || '—'}</div>
          <div class="card-overlay"><div class="card-title">${anime.title || 'Без названия'}</div><div class="card-year">${year || '—'}</div></div>`;
        card.addEventListener('click', () => { 
          window.location.href = `anime.html?id=${anime.id}`; 
        });
        
        card.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          const folders = JSON.parse(localStorage.getItem('anix_folders') || '[]');
          if (folders.length === 0) return;
          const folderList = folders.map((f, i) => `${i+1}. ${f.title} (${(f.animeIds||[]).length})`).join('\n');
          const choice = prompt(`Выберите папку:\n\n${folderList}`);
          if (choice) {
            const index = parseInt(choice) - 1;
            if (index >= 0 && index < folders.length) {
              if (!folders[index].animeIds) folders[index].animeIds = [];
              if (!folders[index].animeIds.includes(anime.id)) {
                folders[index].animeIds.push(anime.id);
                localStorage.setItem('anix_folders', JSON.stringify(folders));
                alert(`Добавлено в «${folders[index].title}»`);
              } else {
                folders[index].animeIds = folders[index].animeIds.filter(id => id !== anime.id);
                localStorage.setItem('anix_folders', JSON.stringify(folders));
                alert(`Убрано из «${folders[index].title}»`);
              }
            }
          }
        });
        
        return card;
      }

      function renderGrid(animeList) {
        animeGrid.innerHTML = '';
        countText.textContent = animeList.length + ' аниме';
        if (animeList.length === 0) { animeGrid.innerHTML = '<div class="empty-state"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>Ничего не найдено</div>'; return; }
        animeList.forEach(anime => animeGrid.appendChild(createCard(anime)));
      }

      function renderNormalMode() {
        randomBtn.style.display = 'flex';
        animeGrid.style.display = 'grid';
        document.getElementById('controlsRow').querySelectorAll('.control-select')[0].style.display = 'inline';
        document.getElementById('controlsRow').querySelectorAll('.control-select')[1].style.display = 'inline';
        const filtered = getFilteredAnime();
        renderGrid(filtered);
        sortSelect.style.display = 'inline';
      }

      function renderFolderMode() {
        genreFilter.style.display = 'none';
        tagFilter.style.display = 'none';
        randomBtn.style.display = 'none';
        animeGrid.innerHTML = '';
        animeGrid.style.display = 'block';
        sortSelect.style.display = 'none';

        // Создаём контейнер для папок
        const container = document.createElement('div');
        container.className = 'folders-container';
        animeGrid.appendChild(container);
        
        const folders = getFolders();
        let total = 0;

        function moveFolder(id, direction) {
          let folders = getFolders();
          const index = folders.findIndex(f => f.id === id);
          if (index === -1) return;
          if (direction === 'up' && index > 0) {
            [folders[index], folders[index - 1]] = [folders[index - 1], folders[index]];
          } else if (direction === 'down' && index < folders.length - 1) {
            [folders[index], folders[index + 1]] = [folders[index + 1], folders[index]];
          }
          saveFolders(folders);
          renderFolderMode();
        }

        folders.forEach(folder => {
          const folderAnime = allAnime.filter(a => folder.animeIds && folder.animeIds.includes(a.id));
          total += folderAnime.length;
          const scores = folderAnime.filter(a => a.userRating).map(a => parseFloat(a.userRating));
          const avg = scores.length ? (scores.reduce((a,b) => a+b, 0) / scores.length).toFixed(1) : '—';

          const section = document.createElement('div');
          section.className = 'folder-section';
          section.innerHTML = `
            <div class="folder-header" data-folder-id="${folder.id}">
              <span class="folder-toggle collapsed"><i class="fas fa-chevron-down"></i></span>
              <span class="folder-title">${folder.title}</span>
              <span class="folder-count">(${folderAnime.length})</span>
              <span class="folder-avg">⭐ ${avg}</span>
              <div class="folder-actions">
                <button class="folder-action-btn" data-action="up" data-id="${folder.id}"><i class="fas fa-arrow-up"></i></button>
                <button class="folder-action-btn" data-action="down" data-id="${folder.id}"><i class="fas fa-arrow-down"></i></button>
                <button class="folder-action-btn" data-action="edit" data-id="${folder.id}"><i class="fas fa-pen"></i></button>
                <button class="folder-action-btn" data-action="delete" data-id="${folder.id}"><i class="fas fa-trash"></i></button>
              </div>
            </div>
            <div class="folder-body collapsed"><div class="folder-grid"></div></div>`;

          const grid = section.querySelector('.folder-grid');
          if (folderAnime.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="padding:1rem;font-size:0.8rem;">Папка пуста</div>';
          } else {
            folderAnime.forEach(anime => grid.appendChild(createCard(anime)));
          }

          // Сворачивание
          section.querySelector('.folder-header').addEventListener('click', function(e) {
            if (e.target.closest('.folder-action-btn')) return;
            const body = section.querySelector('.folder-body');
            const toggle = section.querySelector('.folder-toggle');
            body.classList.toggle('collapsed');
            toggle.classList.toggle('collapsed');
          });

          container.appendChild(section);
        });

        const folderCount = folders.length;
        let word = 'папок';
        if (folderCount % 10 === 1 && folderCount % 100 !== 11) {
          word = 'папка';
        } else if (folderCount % 10 >= 2 && folderCount % 10 <= 4 && (folderCount % 100 < 10 || folderCount % 100 >= 20)) {
          word = 'папки';
        }
        countText.textContent = folderCount + ' ' + word;
        
        if (folders.length === 0) {
          container.innerHTML = '<div class="empty-state">Нет папок. Создайте первую!</div>';
        }
        
        // Кнопка создания папки
        const addBtn = document.createElement('button');
        addBtn.className = 'add-folder-btn';
        addBtn.id = 'addFolderBtn';
        addBtn.innerHTML = '<i class="fas fa-plus"></i> Создать папку';
        addBtn.addEventListener('click', () => openFolderModal());
        animeGrid.appendChild(addBtn);

        // Кнопки папок
        animeGrid.querySelectorAll('.folder-action-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            if (this.dataset.action === 'edit') editFolder(id);
            else if (this.dataset.action === 'delete') deleteFolder(id);
            else if (this.dataset.action === 'up') moveFolder(id, 'up');
            else if (this.dataset.action === 'down') moveFolder(id, 'down');
          });
        });
        
        // Скрыть все папки изначально
        container.querySelectorAll('.folder-body').forEach(body => {
          body.classList.add('collapsed');
        });
        container.querySelectorAll('.folder-toggle').forEach(toggle => {
          toggle.classList.add('collapsed');
        });

        // Открыть первую папку
        const firstBody = container.querySelector('.folder-body');
        const firstToggle = container.querySelector('.folder-toggle');
        if (firstBody) {
          firstBody.classList.remove('collapsed');
        }
        if (firstToggle) {
          firstToggle.classList.remove('collapsed');
        }
      }

      function openFolderModal(id = null) {
        currentEditingFolder = id;
        if (id) {
          const folders = getFolders();
          const f = folders.find(f => f.id === id);
          modalTitle.textContent = 'Переименовать папку';
          modalFolderName.value = f ? f.title : '';
        } else {
          modalTitle.textContent = 'Создать папку';
          modalFolderName.value = '';
        }
        editModal.style.display = 'flex';
      }

      function editFolder(id) { openFolderModal(id); }

      function deleteFolder(id) {
        if (confirm('Удалить папку?')) {
          saveFolders(getFolders().filter(f => f.id !== id));
          renderFolderMode();
        }
      }

      function closeModal() { editModal.style.display = 'none'; currentEditingFolder = null; }

      modalSaveBtn.addEventListener('click', () => {
        const title = modalFolderName.value.trim();
        if (!title) return;
        let folders = getFolders();
        if (currentEditingFolder) {
          const idx = folders.findIndex(f => f.id === currentEditingFolder);
          if (idx !== -1) folders[idx].title = title;
        } else {
          folders.push({ id: 'folder_' + Date.now(), title, animeIds: [] });
        }
        saveFolders(folders);
        renderFolderMode();
        closeModal();
      });

      editModal.addEventListener('click', function(e) { if (e.target === editModal) closeModal(); });

      function render() {
        loadCollection();
        populateFilters();
        if (folderMode) {
          tabsRow.style.display = 'none';
          renderFolderMode();
        } else {
          tabsRow.style.display = 'flex';
          genreFilter.style.display = 'inline';
          tagFilter.style.display = 'inline';
          renderNormalMode();
        }
      }

      modeToggle.addEventListener('click', () => {
        folderMode = !folderMode;
        modeToggle.innerHTML = folderMode ? '<i class="fas fa-th-large"></i>' : '<i class="fas fa-folder"></i>';
        modeToggle.title = folderMode ? 'Обычный режим' : 'Режим папок';
        render();
      });

      tabsRow.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-btn')) {
          tabsRow.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentTab = e.target.dataset.tab;
          renderNormalMode();
        }
      });

      genreFilter.addEventListener('change', () => renderNormalMode());
      tagFilter.addEventListener('change', () => renderNormalMode());

      randomBtn.addEventListener('click', () => {
        let pool = folderMode ? allAnime : getFilteredAnime();
        if (pool.length === 0) return;
        if (pool.length > 1) {
          pool = pool.filter(a => a.id !== lastRandomId);
        }
        const random = pool[Math.floor(Math.random() * pool.length)];
        lastRandomId = random.id;
        window.location.href = `anime.html?id=${random.id}`;
      });

      goHomeBtn.addEventListener('click', () => window.location.href = 'index.html');
      profileAvatarTop.addEventListener('click', () => window.location.href = 'profile.html');
      render();
    })();

    function tryLoad(id, base) {
      const f = ['.gif','.png','.jpg','.jpeg','.webp'];
      const img = document.getElementById(id);
      let i = 0;
      function next() { if (i >= f.length) return; img.src = base + f[i]; i++; }
      img.onerror = next;
      next();
    }
    tryLoad('topAvatarImg', 'profile/avatar');
  </script>
</body>
</html>
