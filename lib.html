<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#0e0e1a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniSpace — Библиотека</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #0e0e1a;
      min-height: 100vh; display: flex; flex-direction: column; color: #f0e6ff; margin: 0;
    }
    .app { display: flex; flex-direction: column; flex: 1; width: 100%; }
    .top-bar { padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: center; position: relative; }
    .logo { background: linear-gradient(135deg, #7b4bff, #b084ff); border: none; color: white; font-weight: bold; font-size: 1.2rem; padding: 0.5rem 1.4rem; border-radius: 2.5rem; cursor: pointer; transition: 0.25s; box-shadow: 0 4px 12px rgba(123,75,255,0.5); border: 1px solid rgba(255,255,255,0.2); }
    .logo:hover { background: linear-gradient(135deg, #925fff, #c09aff); transform: translateY(-1px); }
    .ava { position: absolute; right: 1.5rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(180,130,255,0.6); cursor: pointer; overflow: hidden; background: rgba(123,75,255,0.2); transition: 0.25s; }
    .ava:hover { border-color: #b47aff; box-shadow: 0 0 15px rgba(150,100,255,0.5); }
    .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mode { position: absolute; left: 1.5rem; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(180,130,255,0.4); cursor: pointer; background: rgba(123,75,255,0.15); color: #c9a9ff; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: 0.25s; }
    .mode:hover { border-color: #b47aff; color: white; background: rgba(123,75,255,0.3); }
    .main { flex: 1; display: flex; flex-direction: column; padding: 0.5rem 1.5rem 2rem; width: 100%; max-width: 1200px; margin: 0 auto; }
    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tab { background: rgba(180,130,255,0.1); border: 1px solid rgba(180,130,255,0.2); color: #b5a3d4; font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; font-family: inherit; white-space: nowrap; }
    .tab.active { background: rgba(123,75,255,0.4); border-color: #b47aff; color: white; }
    .tab.bm.active { background: linear-gradient(135deg, #f5d57a, #fce9a9); border-color: #e8c547; color: #5a4a2a; }
    .tab:hover { background: rgba(123,75,255,0.3); color: white; }
    .ctrls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .sel { background: rgba(15,12,28,0.8); border: 1px solid rgba(180,150,220,0.3); color: #cbb8f0; font-size: 0.8rem; padding: 0.4rem 0.8rem; border-radius: 1.5rem; cursor: pointer; font-family: inherit; outline: none; }
    .sel:focus { border-color: #b47aff; }
    .rand { background: linear-gradient(135deg, #ff6b9d, #ff4444); border: none; color: white; font-size: 0.8rem; padding: 0.4rem 1rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; font-family: inherit; display: flex; align-items: center; gap: 0.3rem; margin-left: auto; }
    .rand:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,68,68,0.5); }
    .cnt { font-size: 0.8rem; color: #8b7aaa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.8rem; }
    .card { position: relative; aspect-ratio: 2/3; border-radius: 0.6rem; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid rgba(180,130,255,0.2); background: rgba(25,22,44,0.6); }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.5); border-color: rgba(180,130,255,0.5); }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-over { position: absolute; bottom: 0; left: 0; width: 100%; padding: 0.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.9)); opacity: 0; transition: 0.2s; }
    .card:hover .card-over { opacity: 1; }
    .card-ttl { font-weight: 600; font-size: 0.7rem; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-yr { font-size: 0.6rem; color: #b5a3d4; }
    .card-rate { position: absolute; top: 0.4rem; right: 0.4rem; background: rgba(0,0,0,0.7); color: #f0b300; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 0.3rem; font-weight: 600; }
    .card:hover .card-list { opacity: 0; transition: 0.2s; }
    .card-list { position: absolute; bottom: 0.4rem; left: 0.4rem; font-size: 0.55rem; padding: 0.1rem 0.35rem; border-radius: 0.3rem; font-weight: 600; color: white; opacity: 1; transition: 0.2s; }
    .card-emp { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #5a4b7a; }
    .empty { text-align: center; color: #8b7aaa; padding: 3rem; font-size: 0.95rem; grid-column: 1 / -1; }
    .folder { margin-bottom: 1rem; background: rgba(25,22,44,0.4); border-radius: 0.8rem; border: 1px solid rgba(180,130,255,0.15); overflow: hidden; width: 100%; }
    .f-hdr { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.6rem 0.8rem; background: rgba(30,25,50,0.5); border-bottom: 1px solid rgba(180,130,255,0.1); }
    .f-hdr:hover .f-ttl { color: white; }
    .f-ttl { font-size: 0.85rem; font-weight: 600; color: #cbb8f0; transition: 0.2s; }
    .f-cnt { font-size: 0.7rem; color: #8b7aaa; }
    .f-avg { font-size: 0.7rem; color: #f0b300; margin-left: auto; }
    .f-tog { color: #8b7aaa; transition: 0.2s; font-size: 0.7rem; }
    .f-tog.col i { transform: rotate(-90deg); }
    .f-body { transition: 0.2s; padding: 0.6rem; }
    .f-body.col { display: none; }
    .f-acts { display: flex; gap: 0.3rem; margin-left: 0.5rem; }
    .f-act { background: transparent; border: none; color: #6b5b8c; cursor: pointer; font-size: 0.65rem; padding: 0.15rem 0.3rem; border-radius: 0.3rem; transition: 0.2s; }
    .f-act:hover { color: white; background: rgba(180,130,255,0.2); }
    .f-cont { display: flex; flex-direction: column; gap: 1rem; }
    .f-grid { display: flex; gap: 0.8rem; flex-wrap: wrap; }
    .f-grid .card { width: 130px; flex-shrink: 0; }
    .add-f { background: rgba(180,130,255,0.1); border: 1px dashed rgba(180,130,255,0.3); color: #8b7aaa; padding: 0.5rem; border-radius: 0.6rem; cursor: pointer; font-size: 0.8rem; transition: 0.2s; text-align: center; margin-top: 1rem; width: 100%; }
    .add-f:hover { background: rgba(180,130,255,0.2); color: #cbb8f0; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
    .modal-box { background: rgba(25,22,44,0.98); border: 1px solid rgba(180,130,255,0.5); border-radius: 1.2rem; padding: 1.5rem; max-width: 450px; width: 90%; box-shadow: 0 20px 40px black; }
    .modal-ttl { font-weight: 600; color: #cbb8f0; margin-bottom: 1rem; }
    .modal-inp { width: 100%; background: rgba(10,8,20,0.7); border: 1px solid rgba(180,150,220,0.35); border-radius: 0.6rem; padding: 0.5rem 0.8rem; color: #e4d7ff; font-size: 0.85rem; margin-bottom: 0.8rem; font-family: inherit; outline: none; }
    .modal-inp:focus { border-color: #b47aff; }
    .modal-btn { padding: 0.45rem 1.2rem; border-radius: 1.5rem; font-size: 0.8rem; cursor: pointer; border: none; font-family: inherit; background: linear-gradient(135deg, #7b4bff, #b084ff); color: white; }
    
    /* Мобильная оптимизация */
    @media (max-width: 600px) {
      .top-bar { padding: 0.75rem 1rem; }
      .logo { font-size: 1rem; padding: 0.4rem 1rem; }
      .ava { width: 32px; height: 32px; right: 1rem; }
      .mode { width: 32px; height: 32px; left: 1rem; }
      .main { padding: 1rem; }
      .btn { font-size: 0.9rem; padding: 0.7rem 1.5rem; }
      .btn-row { flex-direction: column; gap: 0.5rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.5rem; }
      .card-over { opacity: 1; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 0.3rem; }
      .card-ttl { font-size: 0.6rem; }
      .tabs { gap: 0.2rem; }
      .tab { font-size: 0.7rem; padding: 0.3rem 0.7rem; }
      .ctrls { gap: 0.3rem; }
      .sel { font-size: 0.7rem; padding: 0.3rem 0.6rem; }
      .rand { font-size: 0.7rem; padding: 0.3rem 0.8rem; }
    }

    footer { text-align: left; padding: 1rem; color: #5a507a; font-size: 0.8rem; border-top: 1px solid rgba(120,100,180,0.3); margin-top: auto; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="mode" id="modeToggle"><i class="fas fa-folder"></i></div>
      <button class="logo" id="goHomeBtn">AniSpace</button>
      <div class="ava" id="profileAvatarTop"><img id="topAvatarImg" src="" alt="" style="display:block;"></div>
    </div>
    <main class="main">
      <div class="tabs" id="tabsRow">
        <button class="tab active" data-tab="all">Все</button>
        <button class="tab bm" data-tab="bookmarked">Избранное</button>
        <button class="tab" data-tab="watching">Смотрю</button>
        <button class="tab" data-tab="watched">Просмотрено</button>
        <button class="tab" data-tab="dropped">Брошено</button>
        <button class="tab" data-tab="planned">В планах</button>
        <button class="tab" data-tab="rewatching">Пересмотрю</button>
      </div>
      <div class="ctrls" id="controlsRow">
        <select class="sel" id="genreFilter"><option value="">Все жанры</option></select>
        <select class="sel" id="tagFilter"><option value="">Все теги</option></select>
        <select class="sel" id="sortSelect">
          <option value="title">По названию</option>
          <option value="addedAt">По дате добавления</option>
          <option value="releaseDate">По дате выхода</option>
          <option value="userRating">По личному рейтингу</option>
          <option value="avgRating">По рейтингу Shikimori</option>
        </select>
        <span class="cnt" id="countText">0 аниме</span>
        <button class="rand" id="randomBtn"><i class="fas fa-random"></i> Случайное</button>
      </div>
      <div class="grid" id="animeGrid"></div>
    </main>
    <footer>© AniSpace by cmd</footer>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-box">
      <div class="modal-ttl" id="modalTitle">Папка</div>
      <input type="text" class="modal-inp" id="modalFolderName" placeholder="Название папки">
      <button class="modal-btn" id="modalSaveBtn">Сохранить</button>
    </div>
  </div>

  <script>
    const goHomeBtn = document.getElementById('goHomeBtn');
    const profileAvatarTop = document.getElementById('profileAvatarTop');
    const modeToggle = document.getElementById('modeToggle');
    const tabsRow = document.getElementById('tabsRow');
    const genreFilter = document.getElementById('genreFilter');
    const tagFilter = document.getElementById('tagFilter');
    const sortSelect = document.getElementById('sortSelect');
    const randomBtn = document.getElementById('randomBtn');
    const animeGrid = document.getElementById('animeGrid');
    const countText = document.getElementById('countText');
    const editModal = document.getElementById('editModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalFolderName = document.getElementById('modalFolderName');
    const modalSaveBtn = document.getElementById('modalSaveBtn');

    let currentTab = 'all', folderMode = false, allAnime = [], currentEditingFolder = null, lastRandomId = null;

    const listColors = { watching:'#88D498', watched:'#809BCE', dropped:'#F28482', planned:'#957DAD', rewatching:'#F6BD60' };
    const listNames = { watching:'Смотрю', watched:'Просмотрено', dropped:'Брошено', planned:'В планах', rewatching:'Пересмотрю' };
    const tagNames = { isekai:'Исекай', slice_of_life:'Повседневное', psychology:'Психология', sport:'Спорт', romance:'Романтика', action:'Экшен', comedy:'Комедия', drama:'Драма', fantasy:'Фэнтези', horror:'Ужасы', mecha:'Меха', music:'Музыка', mystery:'Детектив', sci_fi:'Фантастика', thriller:'Триллер', adventure:'Приключения', historical:'Историческое', military:'Военное', school:'Школа', supernatural:'Сверхъестественное', hentai:'Хентай' };

    const loadCol = () => allAnime = JSON.parse(localStorage.getItem('anix_collection') || '[]');
    const getFolders = () => JSON.parse(localStorage.getItem('anix_folders') || '[]');
    const saveFolders = f => localStorage.setItem('anix_folders', JSON.stringify(f));

    function getFiltered() {
      let f = [...allAnime];
      if (currentTab !== 'all') {
        if (currentTab === 'bookmarked') f = f.filter(a => a.bookmarked === true);
        else f = f.filter(a => (a.list || 'watching') === currentTab);
      }
      if (genreFilter.value) f = f.filter(a => a.genre && a.genre.includes(genreFilter.value));
      if (tagFilter.value) f = f.filter(a => a.tag === tagFilter.value);
      
      f.sort((a, b) => ({title:(a.title||'').localeCompare(b.title||''), addedAt:(b.addedAt||'').localeCompare(a.addedAt||''), 
      releaseDate: (() => {
        const parse = d => { if (!d) return 0; const p = d.split('.'); return +p[2]*10000 + +p[1]*100 + +p[0]; };
        return parse(b.releaseDate) - parse(a.releaseDate);
      })(),
      userRating:parseFloat(b.userRating||0)-parseFloat(a.userRating||0), avgRating:parseFloat(b.avgRating||0)-parseFloat(a.avgRating||0)})[sortSelect.value]||0);
      
      return f;
    }

    function popFilters() {
      const genres = new Set(); allAnime.forEach(a => { if (a.genre) a.genre.split(',').forEach(g => genres.add(g.trim())); });
      genreFilter.innerHTML = '<option value="">Все жанры</option>' + [...genres].sort().map(g => `<option value="${g}">${g}</option>`).join('');
      const tags = new Set(); allAnime.forEach(a => { if (a.tag) tags.add(a.tag); });
      tagFilter.innerHTML = '<option value="">Все теги</option>' + [...tags].sort().map(t => `<option value="${t}">${tagNames[t] || t}</option>`).join('');
    }

    function createCard(anime) {
      const card = document.createElement('div');
      card.className = 'card';
      const year = anime.releaseDate ? anime.releaseDate.split('.')[2] || '' : '';
      const blur = anime.tag === 'hentai' ? 'filter: blur(6px);' : '';
      const rating = anime.avgRating ? parseFloat(anime.avgRating).toFixed(1) : (anime.rating ? parseFloat(anime.rating).toFixed(1) : '—');
      card.innerHTML = `
        ${anime.poster ? `<img src="${anime.poster}" alt="" style="${blur}">` : '<div class="card-emp"><i class="fas fa-image"></i></div>'}
        <div class="card-rate">⭐ ${rating}</div>
        <div class="card-list" style="background:${listColors[anime.list]||'#88D498'};">${listNames[anime.list]||'—'}</div>
        <div class="card-over"><div class="card-ttl">${anime.title||'—'}</div><div class="card-yr">${year||'—'}</div></div>`;
      card.onclick = () => location.href = `anime.html?id=${anime.id}`;
      card.oncontextmenu = e => {
        e.preventDefault();
        const folders = getFolders();
        if (!folders.length) return;
        const choice = prompt(folders.map((f, i) => `${i+1}. ${f.title} (${(f.animeIds||[]).length})`).join('\n'));
        if (choice) {
          const i = parseInt(choice) - 1;
          if (i >= 0 && i < folders.length) {
            if (!folders[i].animeIds) folders[i].animeIds = [];
            folders[i].animeIds.includes(anime.id) ? folders[i].animeIds = folders[i].animeIds.filter(id => id !== anime.id) : folders[i].animeIds.push(anime.id);
            localStorage.setItem('anix_folders', JSON.stringify(folders));
          }
        }
      };
      return card;
    }

    function renderGrid(list) {
      animeGrid.innerHTML = '';
      countText.textContent = list.length + ' аниме';
      if (!list.length) { animeGrid.innerHTML = '<div class="empty"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>Ничего не найдено</div>'; return; }
      list.forEach(a => animeGrid.appendChild(createCard(a)));
    }

    function renderNormal() {
      randomBtn.style.display = 'flex'; animeGrid.style.display = 'grid';
      genreFilter.style.display = tagFilter.style.display = sortSelect.style.display = 'inline';
      renderGrid(getFiltered());
    }

    function moveFolder(id, dir) {
      let folders = getFolders();
      const i = folders.findIndex(f => f.id === id);
      if (i === -1) return;
      if (dir === 'up' && i > 0) [folders[i], folders[i-1]] = [folders[i-1], folders[i]];
      else if (dir === 'down' && i < folders.length-1) [folders[i], folders[i+1]] = [folders[i+1], folders[i]];
      saveFolders(folders); renderFolders();
    }

    function renderFolders() {
      genreFilter.style.display = tagFilter.style.display = sortSelect.style.display = randomBtn.style.display = 'none';
      animeGrid.style.display = 'block'; animeGrid.innerHTML = '';
      const container = document.createElement('div'); container.className = 'f-cont'; animeGrid.appendChild(container);
      const folders = getFolders();
      folders.forEach(folder => {
        const items = allAnime.filter(a => folder.animeIds && folder.animeIds.includes(a.id));
        const scores = items.filter(a => a.userRating).map(a => parseFloat(a.userRating));
        const avg = scores.length ? (scores.reduce((a,b) => a+b, 0) / scores.length).toFixed(1) : '—';
        const section = document.createElement('div'); section.className = 'folder';
        section.innerHTML = `
          <div class="f-hdr" data-folder-id="${folder.id}">
            <span class="f-tog col"><i class="fas fa-chevron-down"></i></span>
            <span class="f-ttl">${folder.title}</span><span class="f-cnt">(${items.length})</span><span class="f-avg">⭐ ${avg}</span>
            <div class="f-acts">
              <button class="f-act" data-action="up" data-id="${folder.id}"><i class="fas fa-arrow-up"></i></button>
              <button class="f-act" data-action="down" data-id="${folder.id}"><i class="fas fa-arrow-down"></i></button>
              <button class="f-act" data-action="edit" data-id="${folder.id}"><i class="fas fa-pen"></i></button>
              <button class="f-act" data-action="delete" data-id="${folder.id}"><i class="fas fa-trash"></i></button>
            </div>
          </div>
          <div class="f-body col"><div class="f-grid"></div></div>`;
        const grid = section.querySelector('.f-grid');
        grid.innerHTML = items.length ? '' : '<div class="empty" style="padding:1rem;font-size:0.8rem;">Папка пуста</div>';
        items.forEach(a => grid.appendChild(createCard(a)));
        section.querySelector('.f-hdr').onclick = function(e) {
          if (e.target.closest('.f-act')) return;
          section.querySelector('.f-body').classList.toggle('col');
          section.querySelector('.f-tog').classList.toggle('col');
        };
        container.appendChild(section);
      });
      const w = folders.length % 10 === 1 && folders.length % 100 !== 11 ? 'папка' : folders.length % 10 >= 2 && folders.length % 10 <= 4 && (folders.length % 100 < 10 || folders.length % 100 >= 20) ? 'папки' : 'папок';
      countText.textContent = folders.length + ' ' + w;
      if (!folders.length) container.innerHTML = '<div class="empty">Нет папок. Создайте первую!</div>';
      const addBtn = document.createElement('button'); addBtn.className = 'add-f'; addBtn.innerHTML = '<i class="fas fa-plus"></i> Создать папку'; addBtn.onclick = () => openFolderModal(); animeGrid.appendChild(addBtn);
      animeGrid.querySelectorAll('.f-act').forEach(btn => btn.onclick = function(e) {
        e.stopPropagation();
        const id = this.dataset.id;
        if (this.dataset.action === 'edit') editFolder(id);
        else if (this.dataset.action === 'delete') deleteFolder(id);
        else if (this.dataset.action === 'up') moveFolder(id, 'up');
        else if (this.dataset.action === 'down') moveFolder(id, 'down');
      });
      const firstBody = container.querySelector('.f-body'), firstToggle = container.querySelector('.f-tog');
      if (firstBody) firstBody.classList.remove('col');
      if (firstToggle) firstToggle.classList.remove('col');
    }

    function openFolderModal(id = null) {
      currentEditingFolder = id;
      modalTitle.textContent = id ? 'Переименовать папку' : 'Создать папку';
      modalFolderName.value = id ? (getFolders().find(f => f.id === id)?.title || '') : '';
      editModal.style.display = 'flex';
    }

    function editFolder(id) { openFolderModal(id); }
    function deleteFolder(id) { if (confirm('Удалить?')) { saveFolders(getFolders().filter(f => f.id !== id)); renderFolders(); } }
    let modalMouseDownTarget = null;
    editModal.onmousedown = e => { modalMouseDownTarget = e.target; };
    editModal.onmouseup = e => {
      if (e.target === editModal && modalMouseDownTarget === editModal) {
        editModal.style.display = 'none';
        currentEditingFolder = null;
      }
    };

    modalSaveBtn.onclick = () => {
      const title = modalFolderName.value.trim(); if (!title) return;
      let folders = getFolders();
      if (currentEditingFolder) { const i = folders.findIndex(f => f.id === currentEditingFolder); if (i !== -1) folders[i].title = title; }
      else folders.push({ id: 'folder_' + Date.now(), title, animeIds: [] });
      saveFolders(folders); renderFolders(); editModal.style.display = 'none';
    };

    function render() {
      loadCol(); popFilters();
      if (folderMode) { tabsRow.style.display = 'none'; renderFolders(); }
      else { tabsRow.style.display = 'flex'; renderNormal(); }
    }

    modeToggle.onclick = () => { folderMode = !folderMode; modeToggle.innerHTML = folderMode ? '<i class="fas fa-th-large"></i>' : '<i class="fas fa-folder"></i>'; render(); };
    tabsRow.onclick = e => {
      if (e.target.classList.contains('tab')) {
        tabsRow.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTab = e.target.dataset.tab;
        renderNormal();
      }
    };
    genreFilter.onchange = () => renderNormal();
    tagFilter.onchange = () => renderNormal();
    sortSelect.onchange = () => renderNormal();
    randomBtn.onclick = () => {
      let pool = folderMode ? allAnime : getFiltered();
      if (!pool.length) return;
      if (pool.length > 1) pool = pool.filter(a => a.id !== lastRandomId);
      const r = pool[Math.floor(Math.random() * pool.length)];
      lastRandomId = r.id;
      location.href = `anime.html?id=${r.id}`;
    };
    goHomeBtn.onclick = () => location.href = 'index.html';
    profileAvatarTop.onclick = () => location.href = 'profile.html';

    // Загрузка аватарки из профиля
    const profile = JSON.parse(localStorage.getItem('anix_profile') || '{}');
    if (profile.avatar) {
      document.getElementById('topAvatarImg').src = profile.avatar;
      document.getElementById('topAvatarImg').style.display = 'block';
    }
    render();
  </script>
</body>
</html>
