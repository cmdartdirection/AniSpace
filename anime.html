<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="theme-color" content="#f0edf5">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniSpace — Просмотр аниме</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
      background: #f0edf5;
      min-height: 100vh; display: flex; flex-direction: column; color: #2a1a4a; margin: 0;
    }
    .app { display: flex; flex-direction: column; flex: 1; width: 100%; }
    .header { 
      display: flex; align-items: center; gap: 0.5rem;
      padding: 1rem; background: rgba(240,237,245,0.9); 
      backdrop-filter: blur(10px); border-bottom: 1px solid rgba(123,75,255,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .header-title { 
      font-weight: 600; font-size: 1rem; color: #2a1a4a; 
      margin-left: 0.5rem; margin-right: auto; 
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .header-actions { display: flex; gap: 0.3rem; flex-shrink: 0; }
    .icon-btn {
      width: 36px; height: 36px; min-width: 36px; min-height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(123,75,255,0.2); background: transparent;
      color: #6b5b8c; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      transition: 0.2s; position: relative;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(123,75,255,0.1); border-color: #7b4bff; color: #7b4bff; }
    .icon-btn::after {
      content: attr(data-tooltip); position: absolute; top: 110%; left: 50%;
      transform: translateX(-50%); background: #2a1a4a; color: #f0edf5;
      font-size: 0.7rem; padding: 0.3rem 0.6rem; border-radius: 0.4rem;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease; transition-delay: 0s; z-index: 300;
    }
    .icon-btn:hover::after { opacity: 1; transition-delay: 0.6s; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 0; width: 100%; }
    .anime-content { width: 100%; padding: 1.5rem; }
    .top-row { display: flex; gap: 0.8rem; align-items: flex-start; width: 100%; margin-bottom: 0.4rem; }
    .cover-col { flex-shrink: 0; display: flex; flex-direction: column; gap: 0.5rem; width: 240px; }
    .cover { width: 240px; height: 340px; border-radius: 0.8rem; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(123,75,255,0.05); border: 1px solid rgba(123,75,255,0.15); }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover-placeholder { color: #8b7aaa; font-size: 2.5rem; }
    .list-badge { font-size: 0.7rem; font-weight: 600; padding: 0.3rem 0.7rem; border-radius: 0.5rem; text-align: center; width: 100%; }
    .list-badge-wrapper { position: relative; width: 100%; }
    .list-badge-wrapper .list-badge { display: block; width: 100%; text-align: center; }
    .l-watching { background: rgba(136,212,152,0.2); color: #3d7a45; border: 1px solid rgba(136,212,152,0.4); }
    .l-watched { background: rgba(128,155,206,0.2); color: #3d5a8a; border: 1px solid rgba(128,155,206,0.4); }
    .l-dropped { background: rgba(242,132,130,0.2); color: #8a3d3d; border: 1px solid rgba(242,132,130,0.4); }
    .l-planned { background: rgba(149,125,173,0.2); color: #5a3d7a; border: 1px solid rgba(149,125,173,0.4); }
    .l-rewatching { background: rgba(246,189,96,0.2); color: #7a5a2a; border: 1px solid rgba(246,189,96,0.4); }
    .info-col { flex: 1; display: flex; flex-direction: column; gap: 0.6rem; min-width: 0; }
    .title { font-size: 1.3rem; font-weight: 700; color: #2a1a4a; }
    .subtitle { font-size: 0.85rem; color: #6b5b8c; }
    .grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .cell { position: relative; flex: 1 1 calc(50% - 0.4rem); min-width: 100px; background: rgba(245,242,252,0.95); border-radius: 0.6rem; padding: 0.5rem 0.7rem; border: 1px solid rgba(123,75,255,0.12); }
    .cell.half { flex: 1 1 calc(50% - 0.4rem); }
    .cell.full { flex: 1 1 100%; }
    .cell-l { font-size: 0.6rem; text-transform: uppercase; color: #6b5b8c; letter-spacing: 0.3px; font-weight: 600; margin-bottom: 0.15rem; }
    .cell-v { font-weight: 600; font-size: 0.85rem; color: #2a1a4a; }
    .desc-row { width: 100%; }
    .desc-row .cell { max-height: 100px; overflow: hidden; transition: max-height 0.3s ease; }
    .desc-fade { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: linear-gradient(transparent, rgba(245,242,252,0.95)); pointer-events: none; transition: opacity 0.3s ease; }
    .desc-fade.hidden { opacity: 0; }
    .rating-edit { display: flex; align-items: center; gap: 0.4rem; }
    .rating-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: linear-gradient(to right, #7b4bff, #e0b0ff); border-radius: 2px; outline: none; cursor: pointer; }
    .rating-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: white; border-radius: 50%; border: 2px solid #7b4bff; box-shadow: 0 0 6px rgba(123,75,255,0.3); }
    .rating-value { font-weight: 700; font-size: 0.85rem; color: #2a1a4a; min-width: 24px; text-align: center; }
    
    .screenshots-section { margin-top: 1rem; }
    .screenshots-title { font-size: 0.8rem; font-weight: 600; color: #6b5b8c; text-transform: uppercase; margin-bottom: 0.5rem; }
    .screenshots-row { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.3rem; }
    .screenshots-row img { height: 120px; border-radius: 0.6rem; cursor: pointer; transition: 0.2s; border: 1px solid rgba(123,75,255,0.12); }
    .screenshots-row img:hover { transform: scale(1.02); border-color: #7b4bff; }
    
    .comment-section { max-width: 100%; margin-top: 1rem; }
    .comment-toggle { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: #6b5b8c; text-transform: uppercase; padding: 0.5rem 0; border-top: 1px solid rgba(123,75,255,0.1); }
    .comment-toggle i { font-size: 0.6rem; transition: transform 0.3s; }
    .comment-toggle.open i { transform: rotate(180deg); }
    .comment-body { padding-top: 0.5rem; }
    .cmt-ta { width: 100%; background: rgba(245,242,252,0.95); border: 1px solid rgba(123,75,255,0.2); border-radius: 0.6rem; padding: 0.5rem 0.8rem; color: #2a1a4a; font-size: 0.8rem; resize: none; overflow: hidden; min-height: 60px; font-family: inherit; outline: none; }
    .cmt-ta:focus { border-color: #7b4bff; }
    .cmt-text { font-size: 0.8rem; color: #4a3a6a; line-height: 1.5; }
    .dropdown-menu { position: absolute; top: calc(100% + 0.5rem); background: #f0edf5; border: 1px solid rgba(123,75,255,0.2); border-radius: 1rem; padding: 0.8rem; display: none; flex-direction: column; gap: 0.5rem; min-width: 160px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); z-index: 200; }
    .dropdown-menu.show { display: flex; }
    .sort-option { padding: 0.5rem 0.8rem; border-radius: 0.6rem; border: none; background: transparent; color: #2a1a4a; font-size: 0.8rem; cursor: pointer; text-align: left; font-family: inherit; transition: 0.1s; }
    .sort-option:hover { background: rgba(123,75,255,0.1); }
    .sort-option.active { background: rgba(123,75,255,0.2); font-weight: 600; }
    .clickable { cursor: pointer; }
    #listDropdown { left: 50%; transform: translateX(-50%); }
    .empty { text-align: center; color: #6b5b8c; padding: 3rem; }
    @media (max-width: 600px) {
      .header { padding: 0.75rem 1rem; }
      .top-row { flex-direction: column; align-items: center; }
      .cover { width: 200px; height: 280px; } .cover-col { width: 200px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="icon-btn" onclick="history.back()" title="Назад"><i class="fas fa-arrow-left"></i></button>
      <span class="header-title" id="headerTitle">Просмотр аниме</span>
      <div class="header-actions">
        <button class="icon-btn" data-tooltip="В избранное" id="bmBtn"><i class="fas fa-bookmark" id="bmIcon"></i></button>
        <button class="icon-btn" data-tooltip="Редактировать" id="editBtn"><i class="fas fa-pen"></i></button>
        <button class="icon-btn" data-tooltip="Удалить" id="delBtn"><i class="fas fa-trash"></i></button>
        <button class="icon-btn" data-tooltip="Смотреть" id="watchBtn"><i class="fas fa-play"></i></button>
      </div>
    </header>
    <main class="main" id="mainContent"></main>
  </div>

  <script>
    const main = document.getElementById('mainContent');
    const params = new URLSearchParams(location.search);
    const animeId = params.get('id');
    const lists = { watching:'Смотрю', watched:'Просмотрено', dropped:'Брошено', planned:'В планах', rewatching:'Пересмотрю' };
    const listC = { watching:'l-watching', watched:'l-watched', dropped:'l-dropped', planned:'l-planned', rewatching:'l-rewatching' };
    const statuses = { ongoing:'Онгоинг', released:'Вышел', announced:'Анонсирован' };
    const tags = { isekai:'Исекай', slice_of_life:'Повседневное', psychology:'Психология', sport:'Спорт', romance:'Романтика', action:'Экшен', comedy:'Комедия', drama:'Драма', fantasy:'Фэнтези', horror:'Ужасы', mecha:'Меха', music:'Музыка', mystery:'Детектив', sci_fi:'Фантастика', thriller:'Триллер', adventure:'Приключения', historical:'Историческое', military:'Военное', school:'Школа', supernatural:'Сверхъестественное', hentai:'Хентай' };
    const gCol = () => JSON.parse(localStorage.getItem('anix_collection') || '[]');
    const sCol = c => localStorage.setItem('anix_collection', JSON.stringify(c));
    let currentAnime = null;

    function render(anime) {
      currentAnime = anime;
      if (!anime.id) anime.id = Date.now();
      const tag = anime.tag ? tags[anime.tag] || anime.tag : '';
      const comment = anime.comment || '';
      
      document.getElementById('headerTitle').textContent = anime.title || 'Просмотр аниме';
      document.title = `AniSpace - ${anime.title || 'Аниме'}`;
      document.getElementById('bmIcon').style.color = anime.bookmarked ? '#f0b300' : '';

      let screenshotsHTML = '';
      if (anime.screenshots && anime.screenshots.length > 0) {
        screenshotsHTML = `
          <div class="screenshots-section">
            <div class="screenshots-title">Кадры</div>
            <div class="screenshots-row">
              ${anime.screenshots.map(s => {
                const url = s.original ? 'https://shikimori.one' + s.original : '';
                return url ? `<img src="${url}" alt="Кадр" onclick="window.open('${url}', '_blank')" onerror="this.style.display='none'">` : '';
              }).join('')}
            </div>
          </div>`;
      } else {
        screenshotsHTML = `
          <div class="screenshots-section">
            <div class="screenshots-title">Кадры</div>
            <div class="screenshots-row">
              <div style="height:120px;min-width:200px;background:rgba(123,75,255,0.05);border-radius:0.6rem;display:flex;align-items:center;justify-content:center;color:#6b5b8c;font-size:0.8rem;border:1px solid rgba(123,75,255,0.12);">
                <i class="fas fa-image" style="margin-right:0.4rem;"></i> Нет кадров
              </div>
            </div>
          </div>`;
      }

      main.innerHTML = `
        <div class="anime-content">
          <div class="top-row">
            <div class="cover-col">
              <div class="cover" id="coverContainer"></div>
              <span class="list-badge-wrapper">
                <span class="list-badge ${listC[anime.list] || 'l-watching'} clickable" id="listBadge">${lists[anime.list] || 'Смотрю'}</span>
                <div class="dropdown-menu" id="listDropdown">
                  <button class="sort-option" data-list="watching">Смотрю</button>
                  <button class="sort-option" data-list="watched">Просмотрено</button>
                  <button class="sort-option" data-list="dropped">Брошено</button>
                  <button class="sort-option" data-list="planned">В планах</button>
                  <button class="sort-option" data-list="rewatching">Пересмотрю</button>
                </div>
              </span>
            </div>
            <div class="info-col">
              <div class="title clickable" id="animeTitle" data-original="${anime.originalName || ''}">${anime.title || 'Без названия'}</div>
              <div class="grid">
                <div class="cell half"><div class="cell-l">Оценка Shikimori</div><div class="cell-v">${anime.avgRating || '—'}</div></div>
                <div class="cell half clickable" id="ratingCell">
                  <div class="cell-l">Моя оценка</div>
                  <div class="cell-v" id="ratingDisplay">${anime.userRating || '—'}</div>
                  <div class="rating-edit" id="ratingEdit" style="display:none;">
                    <input type="range" class="rating-slider" id="ratingSlider" min="0" max="10" value="${anime.userRating || 7}" step="0.5">
                    <span class="rating-value" id="ratingValue">${anime.userRating || 7}</span>
                  </div>
                </div>
                <div class="cell half"><div class="cell-l">Серий</div><div class="cell-v">${anime.episodes || '—'} (${anime.status || 'Вышел'})</div></div>
                <div class="cell half"><div class="cell-l">Тег</div><div class="cell-v">${tag || '—'}</div></div>
                <div class="cell half"><div class="cell-l">Студия</div><div class="cell-v">${anime.studio || '—'}</div></div>
                <div class="cell half"><div class="cell-l">Дата выхода</div><div class="cell-v">${anime.releaseDate || '—'}</div></div>
                <div class="cell full"><div class="cell-l">Жанр</div><div class="cell-v">${anime.genre || '—'}</div></div>
              </div>
              <div class="desc-row">
                <div class="cell full clickable" id="descCell">
                  <div class="cell-l">Описание</div>
                  <div class="cell-v" id="descText">${anime.description || 'Описание отсутствует'}</div>
                  <div class="desc-fade" id="descFade"></div>
                </div>
              </div>
            </div>
          </div>
          ${screenshotsHTML}
          <div class="comment-section">
            <div class="comment-toggle" id="commentToggle"><span>Комментарий</span><i class="fas fa-chevron-down"></i></div>
            <div class="comment-body" id="commentBody" style="display:none;">
              <div id="cmtDisplay" style="${comment ? '' : 'display:none;'}">
                <div class="cmt-text">${(comment || '').replace(/\n/g, '<br>')}</div>
              </div>
              <div id="cmtEditBlock" style="${comment ? 'display:none;' : ''}">
                <textarea class="cmt-ta" id="commentInput" placeholder="Оставьте комментарий...">${comment}</textarea>
                <div style="display:flex;gap:0.4rem;margin-top:0.5rem;justify-content:flex-end;">
                  <button class="icon-btn" id="cmtSave"><i class="fas fa-save"></i></button>
                </div>
              </div>
            </div>
          </div>
        </div>`;

      // Постер
      const coverContainer = document.getElementById('coverContainer');
      if (coverContainer) {
        if (anime.poster && !anime.poster.includes('missing_original')) {
          const img = document.createElement('img');
          img.src = anime.poster;
          img.onerror = () => { coverContainer.innerHTML = '<i class="fas fa-image cover-placeholder"></i>'; };
          coverContainer.appendChild(img);
        } else {
          coverContainer.innerHTML = '<i class="fas fa-image cover-placeholder"></i>';
        }
      }

      // Переключение названия (русский/японский)
      const animeTitle = document.getElementById('animeTitle');
      if (animeTitle && anime.originalName) {
        let showingRussian = true;
        animeTitle.onclick = function() {
          if (showingRussian) {
            animeTitle.textContent = anime.originalName;
          } else {
            animeTitle.textContent = anime.title;
          }
          showingRussian = !showingRussian;
        };
      }

      // Дропдаун списка
      const listBadge = document.getElementById('listBadge');
      const listDropdown = document.getElementById('listDropdown');
      if (listBadge && listDropdown) {
        listDropdown.querySelectorAll('.sort-option').forEach(opt => opt.classList.toggle('active', opt.dataset.list === anime.list));
        listBadge.onclick = function(e) { e.stopPropagation(); listDropdown.classList.toggle('show'); };
        listDropdown.querySelectorAll('.sort-option').forEach(opt => {
          opt.onclick = function(e) {
            e.stopPropagation();
            const c = gCol(); const i = c.findIndex(a => a.id == anime.id);
            if (i !== -1) { c[i].list = this.dataset.list; sCol(c); render(c[i]); }
          };
        });
        document.addEventListener('click', function closeList(e) {
          if (!listBadge.contains(e.target) && !listDropdown.contains(e.target)) listDropdown.classList.remove('show');
        });
      }

      // Оценка
      const ratingCell = document.getElementById('ratingCell');
      const ratingDisplay = document.getElementById('ratingDisplay');
      const ratingEdit = document.getElementById('ratingEdit');
      const ratingSlider = document.getElementById('ratingSlider');
      const ratingValue = document.getElementById('ratingValue');
      let isEditing = false;
      if (ratingCell) {
        ratingCell.onclick = function(e) {
          if (e.target.closest('#ratingEdit')) return;
          e.stopPropagation();
          isEditing = !isEditing;
          ratingDisplay.style.display = isEditing ? 'none' : 'block';
          ratingEdit.style.display = isEditing ? 'flex' : 'none';
        };
        ratingSlider.oninput = () => ratingValue.textContent = ratingSlider.value;
        ratingSlider.onchange = () => {
          const c = gCol(); const i = c.findIndex(a => a.id == anime.id);
          if (i !== -1) { c[i].userRating = ratingSlider.value; sCol(c); }
        };
        document.addEventListener('click', function(e) {
          if (!ratingCell.contains(e.target) && isEditing) {
            isEditing = false;
            ratingDisplay.style.display = 'block';
            ratingEdit.style.display = 'none';
            ratingDisplay.textContent = ratingSlider.value;
          }
        });
      }

      // Раскрытие описания
      const descCell = document.getElementById('descCell');
      const descFade = document.getElementById('descFade');
      let descExpanded = false;
      if (descCell) {
        descCell.onclick = function() {
          descExpanded = !descExpanded;
          descCell.style.maxHeight = descExpanded ? 'none' : '100px';
          if (descFade) descFade.classList.toggle('hidden', descExpanded);
        };
        const descText = document.getElementById('descText');
        if (descText && descText.scrollHeight <= 100) {
          if (descFade) descFade.style.display = 'none';
        }
      }

      // Комментарий
      document.getElementById('commentToggle').onclick = () => {
        const body = document.getElementById('commentBody');
        const toggle = document.getElementById('commentToggle');
        const isOpen = body.style.display === 'block';
        body.style.display = isOpen ? 'none' : 'block';
        toggle.classList.toggle('open', !isOpen);
      };
      document.getElementById('cmtSave').onclick = () => {
        const c = gCol(); const i = c.findIndex(a => a.id == anime.id);
        if (i !== -1) {
          c[i].comment = document.getElementById('commentInput').value;
          c[i].commentDate = new Date().toISOString();
          sCol(c); render(c[i]);
        }
      };
    }

    document.getElementById('bmBtn').onclick = () => {
      if (!currentAnime) return;
      const c = gCol(); const i = c.findIndex(a => a.id == currentAnime.id);
      if (i !== -1) { c[i].bookmarked = !c[i].bookmarked; sCol(c); render(c[i]); }
    };
    document.getElementById('editBtn').onclick = () => { sessionStorage.setItem('anix_anime_data', JSON.stringify(currentAnime)); location.href = 'animeadd.html'; };
    document.getElementById('delBtn').onclick = () => { if (confirm('Удалить?')) { sCol(gCol().filter(a => a.id != currentAnime.id)); location.href = 'index.html'; } };
    document.getElementById('watchBtn').onclick = () => { window.open(currentAnime?.url || `https://www.google.com/search?q=${encodeURIComponent(currentAnime?.title || '')}+смотреть+онлайн`, '_blank'); };

    if (animeId) {
      const a = gCol().find(a => a.id == animeId);
      a ? render(a) : (main.innerHTML = '<div class="empty"><p>Аниме не найдено</p></div>');
    } else {
      main.innerHTML = '<div class="empty"><p>Аниме не найдено</p></div>';
    }
  </script>
</body>
</html>
